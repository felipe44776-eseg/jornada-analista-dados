    const q = { hud: novo(tp.hud, '<div class="c02-q01"></div>'), topo: novo(tp.topo, '<div class="c02-q01"></div>') };
    q.cab = Jogo.cabecalho(q.hud, Q01.cab); q.cab.definir(true);
    q.museu = novo(q.hud, `<div class="c02-q01-museu"><b>${Q01.museu[0]}</b> ${Q01.museu[1]}</div>`);
    q.manual = Jogo.cartao(q.hud, { cabecalho: Q01.manual.cab, linhas: Q01.manual.linhas.map((t, i) => ({ n: (i + 1) + '.', t, destaque: i === 3 })), x: Q01.manual.x, y: Q01.manual.y, largura: Q01.manual.largura, rot: Q01.manual.rot });
    q.manual.definir({ visivel: true });
    q.p2 = novo(q.hud, `<div class="c02-q01-p2"><i></i><span>${Q01.novoJogador}</span></div>`);
    q.fimq = Jogo.frase(q.hud, { texto: Q01.pergunta, acento: true }); q.fimq.definir(true);
    q.cont = Jogo.continuar(q.hud, Q01.continuar, 3); q.cont.el.classList.add('c02-q01-cont'); q.cont.gastar(3);
    q.lascas = Q01.lascas.map((linhas, i) => { const l = Jogo.lasca(q.topo, { linhas, x: LASCA.x, y: Q01.lascaY[i], rot: Q01.lascaRot[i] }); l.fixar(); return l; });
    return q;
  }

  function montar(palco) {
    const tp = Templo.criar(palco, { classe: 'c02', hora: 'amanhecer', construido: true, degrauzinhos: true, pilha: true });
    const H = tp.hud;
    r = { tp };
    /* luz da IA sobre os lances de degrauzinhos e contorno dos degraus "seus": SVG no plano do templo, sob a pilha e os atores */
    r.marcas = svg('g', { class: 'c02-marcas' });
    r.marcas.innerHTML = `<defs><radialGradient id="c02-brilho"><stop offset="0" stop-color="${CIANO}" stop-opacity=".6"/><stop offset=".55" stop-color="${CIANO}" stop-opacity=".2"/><stop offset="1" stop-color="${CIANO}" stop-opacity="0"/></radialGradient></defs>`
      + [1, 2, 3, 4, 5, 6].map(k => { const T = tier(k); return `<ellipse class="c02-luz" cx="${T.x - SR / 2}" cy="${T.y + TH / 2}" rx="54" ry="50" fill="url(#c02-brilho)" style="opacity:0"/>`; }).join('')
      + SEUS.map(k => { const T = tier(k), w = T.w - 4, h = T.h - 4; return `<rect class="c02-seu" x="${T.x + 2}" y="${T.y + 2}" width="${w}" height="${h}" rx="2" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-width="3.2" stroke-dasharray="${2 * (w + h)}" style="opacity:0"/>`; }).join('');
    tp.pilhaG.parentNode.insertBefore(r.marcas, tp.pilhaG);
    r.luz = Array.from(r.marcas.querySelectorAll('.c02-luz')); r.seus = Array.from(r.marcas.querySelectorAll('.c02-seu'));
    r.riscos = tp.tabs.map(t => { const l = t.children[2]; l.classList.add('c02-risco'); return l; });   // a linha escrita de cada tabuleta
    r.corTarefa = tp.tarefas[0].firstElementChild.getAttribute('fill');
    /* o quadro de partida fica por baixo do que é desta cena */
    r.q = quadroDoMundo1(tp);
    /* no plano do templo, acima dos atores: lasca, pedra e o rótulo do prêmio */
    r.lasca = Jogo.lasca(tp.topo, { linhas: PEDRA.lasca, x: LASCA.x, y: LASCA.y, rot: LASCA.rot });
    r.pedra = Jogo.pedra(tp.topo, Object.assign({ linhas: PEDRA.linhas, semente: 11 }, PG));
    r.rotulo = novo(tp.topo, `<div class="c02-rotulo">${RESULTADO}</div>`);
    /* acima do mundo */
    r.cab = Jogo.cabecalho(H, CAB);
    r.aposta = Jogo.aposta(H, Object.assign({}, APOSTA, PAINEL));
    /* cartão dos três números: a moldura é o cartão da camada de jogo; os números grandes são desenho da cena */
    r.tres = Jogo.cartao(H, Object.assign({ linhas: [], rodape: TRES.rodape, rot: -1 }, PAINEL));
    r.tres.el.insertBefore(html(`<div class="c02-tres">${TRES.numeros.map(x => `<div class="c02-num"><i>${x.antes}</i> <b>${x.n}</b> <span>${x.depois}</span></div>`).join('')}</div>`), r.tres.rodape);
    r.nums = Array.from(r.tres.el.querySelectorAll('.c02-num'));
    /* cartão dos estudos: mesma moldura, com o número de cada linha em corpo grande */
    r.estudos = Jogo.cartao(H, Object.assign({ cabecalho: ESTUDOS.cab, linhas: [], rodape: ESTUDOS.rodape, rot: 0.9 }, PAINEL4));
    r.estL = ESTUDOS.linhas.map(l => { const el = html(`<div class="c02-est-l"><b>${l.n}</b> <span>${l.t}</span></div>`); r.estudos.el.insertBefore(el, r.estudos.rodape); return el; });
    r.frase3 = Jogo.frase(H, { texto: FRASE3 }); r.frase4 = Jogo.frase(H, { texto: FRASE4 });
    r.pergunta = Jogo.frase(H, { texto: PERGUNTA, y: 642 }); r.pergunta.el.classList.add('c02-pergunta');   // grande e branca: o ciano fica só com a faísca
    r.fc = novo(H, '<div class="c02-fc"></div>'); Jogo.gameOver(r.fc, CONCLUIDA.join(' <br>'));
    Jogo.logo(H);
    r.hud = Jogo.hud(H, { vidas: VIDAS, fases: FASES.map(f => f.nome), jogadores: JOGADORES });
    r.cor = Array.from(r.hud.el.querySelectorAll('.jg-cor svg'));          // os corações, para a animação de recarga do passo 0
    /* atores: a ordem de criação é a de empilhamento. O brilho do prêmio é desenho da cena e fica atrás dele:
       halo que pulsa, raios que giram e três cintilações, em branco (parado=1 deixa tudo imóvel e à vista) */
    r.brilho = svg('g', { class: 'c02-brilho', transform: `translate(${PREMIO.x},${PREMIO.y - 70 * PREMIO.escala})` });
    r.brilho.innerHTML = `<defs><radialGradient id="c02-halo"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".6" stop-color="#ECEDFF" stop-opacity=".16"/><stop offset="1" stop-color="#ECEDFF" stop-opacity="0"/></radialGradient>
        <radialGradient id="c02-raio" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="80"><stop offset=".4" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
      <circle class="c02-halo" r="76" fill="url(#c02-halo)"/>
      <g class="c02-raios" fill="url(#c02-raio)">${Array.from({ length: 12 }, (_, i) => `<polygon points="-6,-30 0,${i % 2 ? -62 : -80} 6,-30" transform="rotate(${i * 30})"/>`).join('')}</g>
      ${CINTILA.map((c, i) => `<path class="c02-cintila" style="animation-delay:${-i * 0.5}s" fill="#fff" d="M${c.x},${c.y - c.r} L${c.x + c.r * 0.24},${c.y - c.r * 0.24} L${c.x + c.r},${c.y} L${c.x + c.r * 0.24},${c.y + c.r * 0.24} L${c.x},${c.y + c.r} L${c.x - c.r * 0.24},${c.y + c.r * 0.24} L${c.x - c.r},${c.y} L${c.x - c.r * 0.24},${c.y - c.r * 0.24} Z"/>`).join('')}`;
    tp.atores.appendChild(r.brilho);
    r.premio = Jogo.premio(tp.atores, { escala: PREMIO.escala });
    r.premio.el.style.transformOrigin = `${PREMIO.x}px ${PREMIO.y}px`;     // para o prêmio crescer a partir da base
    r.h = Jogo.heroi(tp.atores, { escala: 1 });
    r.ia = Jogo.aliado(tp.atores, { escala: 1 });
    estadoInicial();
  }
  function desmontar() { r = null; }

  /* ---------- estado: tudo o que fim() usa ---------- */
  const op = (el, v) => { el.style.opacity = v; };
  const tf = (el, v) => { el.style.transform = v; };
  function heroiEm(p, estado) { r.h.por(p.x, p.y).estado(estado || 'parado').alerta(false).mostrar(true); }
  function iaEm(p, estado) { r.ia.por(p.x, p.y).estado(estado || 'parada').mostrar(true); }
  /* a linha da tabuleta j escrita pela IA: mais grossa e em ciano */
  function escrita(j, v) {
    const l = r.riscos[j];
    r.tp.tabs[j].classList.toggle('c02-escrita', v);
    l.style.fill = v ? CIANO : ''; l.style.opacity = v ? 1 : ''; l.setAttribute('y', v ? -0.4 : 0.4); l.setAttribute('height', v ? 2.6 : 1.3);
  }
  const tabsDe = k => Array.from({ length: FASES[k - 1].saidas }, (_, i) => PRIMEIRA(k) + i);
  /* degrau k feito pela IA: degrauzinhos acesos em ciano, com a luz por cima, e as saídas escritas na pilha */
  function degrauDaIA(k, v) {
    r.tp.tarefasK[k - 1].forEach(g => { g.classList.toggle('c02-acesa', v); g.firstElementChild.style.fill = v ? CIANO : ''; });
    op(r.luz[k - 1], v ? 1 : 0);
    tabsDe(k).forEach(j => { const el = r.tp.tabs[j]; escrita(j, v); op(el, v ? 1 : 0); tf(el, el._fim); });
  }

  function estadoInicial() {                                             // o quadro "Continuar?" do mundo 1: véu, HUD zerado, herói derrotado
    const L = lado(BASE);
    op(r.tp.veu, Q01.veu); r.tp.nomes(false);
    op(r.rotulo, 0); op(r.fc, 0); op(r.brilho, 0);
    r.hud.definir({ visivel: true, vidas: Q01.vidas, fase: Q01.fase, prazo: Q01.prazo, jogadores: false });
    r.h.por(Q01.sentado.x, Q01.sentado.y).estado('derrotado').mostrar(true);
    r.ia.por(L.x, L.y).estado('parada').mostrar(false);
    r.premio.por(PREMIO.x, PREMIO.y).estado('inteiro').mostrar(false);
  }
  /* estado final de cada passo: só o que o passo muda. Idempotente. */
  const FIM = [
    function fim0() {                                                    // o mundo reinicia: pilha vazia, HUD cheio, herói na base, faísca ao lado
      r.q.hud.remove(); r.q.topo.remove();
      op(r.tp.veu, 0); r.tp.nomes(true); r.tp.pilha(false);
      r.cab.definir(true);
      r.hud.definir({ visivel: true, vidas: VIDAS, fase: 1, prazo: PRAZO[0], jogadores: true });
      heroiEm(BASE); iaEm(lado(BASE));
    },
    function fim1() { r.aposta.definir({ visivel: true, revelada: false }); r.aposta.el.classList.add('c02-espera'); },
    function fim2() {
      r.aposta.el.classList.remove('c02-espera'); r.aposta.definir({ visivel: false, revelada: true });
      DISPARO.forEach(k => degrauDaIA(k, true));
      r.tres.definir({ visivel: true });
      heroiEm(pouso(4)); iaEm(lado(pouso(4)));
      r.hud.definir({ fase: 4, prazo: PRAZO[2] });
    },
    function fim3() {
      r.tres.definir({ visivel: false });
      degrauDaIA(DEGRAU_DA_PEDRA, true); r.lasca.fixar();
      heroiEm(pouso(5)); iaEm(lado(pouso(5)));
      r.hud.definir({ vidas: VIDAS - 1, fase: 5, prazo: PRAZO[3] });
      r.frase3.definir(true);
    },
    function fim4() {
      r.lasca.fixar(false); r.frase3.definir(false);
      r.seus.forEach(el => { op(el, 1); el.style.strokeDashoffset = 0; });
      heroiEm(TOPO); iaEm(IA_FRACA, 'fraca');
      r.estudos.definir({ visivel: true });
      r.hud.definir({ fase: 6, prazo: PRAZO[4] });
      r.frase4.definir(true);
    },
    function fim5() {                                                    // quadro final: é daqui que a cena 03 parte
      r.estudos.definir({ visivel: false }); r.frase4.definir(false);
      heroiEm(TOPO); iaEm(IA_TOPO);
      r.premio.por(PREMIO.x, PREMIO.y).estado('inteiro').mostrar(true); tf(r.premio.el, 'none'); op(r.brilho, 1);
      op(r.fc, 1); tf(r.fc, 'none'); op(r.rotulo, 1); tf(r.rotulo, 'none');
      r.pergunta.definir(true);
      r.hud.definir({ prazo: PRAZO[5] });
    }
  ];

  /* ================= Parte 3: efeitos próprios da cena e os passos 0 a 3 ================= */
  const some = [{ opacity: 1 }, { opacity: 0 }], surge = [{ opacity: 0 }, { opacity: 1 }];
  const POP = [{ opacity: 0, transform: 'scale(.55)' }, { opacity: 1, transform: 'scale(1.1)', offset: 0.7 }, { opacity: 1, transform: 'scale(1)' }];
  const pisca = v => v.map((o, k) => ({ opacity: o, offset: k / (v.length - 1), easing: 'step-end' }));
  /* anel de luz que se abre a partir de um ponto (camada de efeitos do templo) */
  function anel(ctx, x, y, cor, k) {
    const c = svg('circle', { cx: x, cy: y, r: 20, fill: 'none', stroke: cor, 'stroke-width': 5, class: 'jg-po' }); r.tp.fx.appendChild(c); ctx.temp(c);
    const a = ctx.anim(c, [{ transform: 'scale(.3)', opacity: 0.95 }, { transform: `scale(${k || 4})`, opacity: 0 }], { duration: 560, easing: 'ease-out' });
    if (a) a.onfinish = () => ctx.soltar(c);
  }

  /* ---------- a IA faz o degrau k: os degrauzinhos acendem em ciano, um a um, e as saídas se escrevem e voam para a pilha ----------
     t = quando a faísca parte para o degrau (ms a partir de agora). Devolve o instante em que a última tabuleta pousa */
  const VOO_TAB = 430, PASSO_TAB = 36;
  function rajada(ctx, k, t) {
    const s = ctx.som, tp = r.tp, tar = tp.tarefasK[k - 1], P = pairo(k), js = tabsDe(k);
    tar.forEach((g, q) => {
      const tt = t + 40 + q * (170 / tar.length);
      ctx.anim(g.firstElementChild, [{ fill: r.corTarefa }, { fill: '#fff', offset: 0.4 }, { fill: CIANO }], { duration: 240, delay: tt });
      ctx.anim(g, [{ transform: 'scaleY(1)' }, { transform: 'scaleY(1.45)' }, { transform: 'scaleY(1)' }], { duration: 240, delay: tt, fill: 'none', easing: 'ease-out' });
    });
    ctx.anim(r.luz[k - 1], surge, { duration: 260, delay: t + 60 });
    ctx.anim(tp.flashes[k - 1], [{ opacity: 0, fill: CIANO }, { opacity: 0.34, fill: CIANO }, { opacity: 0, fill: CIANO }], { duration: 520, delay: t + 60, fill: 'none' });
    js.forEach((j, i) => {
      const el = tp.tabs[j], d = t + 170 + i * PASSO_TAB, Q = el._p, sx = P.x + 50 + (i % 3) * 18, sy = P.y - 14 - (i % 4) * 15;
      const aqui = `translate(${sx}px,${sy}px) rotate(0deg) scale(2.4)`, mx = Math.round(sx + (Q.x - sx) * 0.5), my = Math.round(Math.min(sy, Q.y) - 40);
      escrita(j, true);
      /* a tabuleta surge grande ao lado da faísca, a linha se escreve em ciano, e ela voa para o lugar dela na pilha */
      ctx.anim(el, [
        { opacity: 0, transform: `translate(${sx}px,${sy}px) rotate(-8deg) scale(.7)` },
        { opacity: 1, transform: aqui, offset: 0.14 },
        { opacity: 1, transform: aqui, offset: 0.4, easing: 'cubic-bezier(.45,0,.9,.55)' },
        { opacity: 1, transform: `translate(${mx}px,${my}px) rotate(14deg) scale(1.5)`, offset: 0.72, easing: 'cubic-bezier(.2,.4,.6,1)' },
        { opacity: 1, transform: el._fim }], { duration: VOO_TAB, delay: d });
      ctx.anim(r.riscos[j], [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 100, delay: d + VOO_TAB * 0.14, easing: 'ease-out' });
      ctx.em(d + VOO_TAB, () => s.clac({ tom: 1.3 + j * 0.016, ganho: 0.22 }));
    });
    return t + 170 + (js.length - 1) * PASSO_TAB + VOO_TAB;
  }
  /* a pedra desfaz o degrau k: os degrauzinhos apagam e as saídas dele saltam da pilha. Crie só na hora (dentro de ctx.em) */
  function desfazerDegrau(ctx, k) {
    r.tp.tarefasK[k - 1].forEach(g => ctx.anim(g.firstElementChild, [{ fill: CIANO }, { fill: r.corTarefa }], { duration: 200 }));
    ctx.anim(r.luz[k - 1], some, { duration: 200 });
    tabsDe(k).forEach((j, i) => { const el = r.tp.tabs[j], Q = el._p; ctx.anim(el, [{ opacity: 1, transform: el._fim }, { opacity: 0, transform: `translate(${Math.round(Q.x + 26 + i * 9)}px,${Math.round(Q.y - 52)}px) rotate(${40 + i * 25}deg) scale(1)` }], { duration: 380, delay: i * 30, easing: 'ease-out' }); });
  }
  /* "a IA o leva de volta": a faísca dispara na frente, um fio de luz a liga ao herói e ele sobe acelerado de a até b. Crie só na hora */
  function puxar(ctx, a, b, ms) {
    const s = ctx.som, cam = rota(a, b), L = lado(pouso(b));
    const fio = svg('line', { stroke: CIANO, 'stroke-width': 3.2, 'stroke-linecap': 'round', opacity: 0.85 }); r.tp.fx.appendChild(fio); ctx.temp(fio);
    M.voar(ctx, r.ia, cam.map(lado), ms - 70, { estado: 'disparando', curva: E.inOut });
    M.andar(ctx, r.h, cam, ms - 70, { atraso: 70, curva: E.inOut, ganho: 0 });
    ctx.tween(ms, () => { fio.setAttribute('x1', r.h.x + 6); fio.setAttribute('y1', r.h.y - 74); fio.setAttribute('x2', r.ia.x); fio.setAttribute('y2', r.ia.y); }, { fim: () => ctx.soltar(fio) });
    s.chip({ tipo: 'triangle', freq: 330, ate: 1320, dur: ms / 1000, ganho: 0.16 });
    rajada(ctx, b, 30);
    ctx.em(ms, () => { anel(ctx, L.x, L.y, CIANO, 3); s.chip({ freq: 1320, dur: 0.1, ganho: 0.1 }); });
  }

  /* ---------- passo 0: sai da tela "Continuar?" do mundo 1; o HUD reinicia; herói na base; a faísca chega ---------- */
  function tocar0(ctx) {
    const s = ctx.som, tp = r.tp, q = r.q, L = lado(BASE);
    s.ambiente({ vento: 0.45 }, 2.5);
    /* "Continuar?" aceito: a resposta pisca. No instante do corte, só isso muda: o resto do quadro do mundo 1 fica como estava
       (as animações de saída nascem na hora, dentro de ctx.em: criada com atraso, a animação já mexe na nitidez do texto) */
    s.chip({ freq: 660, dur: 0.06, ganho: 0.12 }); s.chip({ t: 0.08, freq: 990, dur: 0.14, ganho: 0.12 });
    ctx.anim(q.cont.el, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 1, transform: 'scale(1.14)', offset: 0.3 }, { opacity: 1, transform: 'scale(1)', offset: 0.55 }, { opacity: 0, transform: 'translateY(22px) scale(1)' }], { duration: 560, easing: 'ease-out' });
    /* a tela de derrota sai */
    ctx.em(180, () => {
      q.manual.sair(ctx); ctx.anim(q.fimq.el, some, { duration: 320 });
      ctx.anim(q.p2, [{ opacity: 1, transform: 'translateY(0px)' }, { opacity: 0, transform: 'translateY(24px)' }], { duration: 300, delay: 60, easing: 'ease-in' });
    });
    /* o mundo reinicia: o título antigo sai, o véu sobe, as lascas e a pilha do mundo 1 somem, o herói derrotado pisca e some */
    ctx.em(300, () => {
      ctx.anim(q.cab.el, [{ opacity: 1, transform: 'translateX(0px)' }, { opacity: 0, transform: 'translateX(-28px)' }], { duration: 380, easing: 'ease-in' });
      ctx.anim(q.museu, [{ opacity: 1, transform: 'translateY(0px) rotate(0deg)' }, { opacity: 0, transform: 'translateY(-90px) rotate(-5deg)' }], { duration: 420, easing: 'ease-in' });
      ctx.anim(tp.veu, [{ opacity: Q01.veu }, { opacity: 0 }], { duration: 900, easing: 'cubic-bezier(.4,0,.3,1)' });
      ctx.anim(tp.rotulos, surge, { duration: 500, delay: 450 });
      q.lascas.forEach((l, i) => ctx.anim(l.el, [{ opacity: 1, transform: `translateY(0px) rotate(${Q01.lascaRot[i]}deg)` }, { opacity: 0, transform: `translateY(46px) rotate(${Q01.lascaRot[i] + 7}deg)` }], { duration: 320, delay: 80 + i * 70, easing: 'ease-in' }));
      tp.tabs.forEach((el, j) => ctx.anim(el, some, { duration: 180, delay: 150 + (tp.tabs.length - 1 - j) * 13 }));
      ctx.anim(r.h.el, pisca([1, 0, 1, 0, 1, 0]), { duration: 420, delay: 120 });
    });
    /* o HUD reinicia: fase 1, os corações voltam um a um, o prazo enche */
    const tV = 820;
    ctx.em(tV - 80, () => r.hud.mudarFase(ctx, 1));
    for (let i = 0; i < VIDAS; i++) ctx.em(tV + i * 105, () => {
      r.hud.definir({ vidas: i + 1 });
      ctx.anim(r.cor[i], [{ transform: 'scale(.4)' }, { transform: 'scale(1.5)' }, { transform: 'scale(1)' }], { duration: 260, fill: 'none', easing: 'ease-out' });
      s.chip({ freq: s.penta(i, 523.25), dur: 0.06, ganho: 0.1 });
    });
    ctx.em(tV + VIDAS * 105 + 60, () => { r.hud.gastarPrazo(ctx, PRAZO[0], 650); s.chip({ tipo: 'triangle', freq: 262, ate: 1047, dur: 0.6, ganho: 0.12 }); });
    r.cab.entrar(ctx, 950);
    /* o herói nasce na base: pisca, um anel de luz, toque de "jogador pronto" */
    const tH = 1600;
    ctx.em(tH - 300, () => r.h.por(BASE.x, BASE.y).estado('parado'));     // ainda invisível
    ctx.em(tH, () => { ctx.anim(r.h.el, pisca([0, 1, 0, 1, 0, 1]), { duration: 560 }); s.pronto(); anel(ctx, BASE.x, BASE.y - 60, '#fff', 5); });
    /* a faísca chega riscando o céu e para ao lado dele */
    const tA = 2400, VOO = 850;
    ctx.anim(r.ia.el, surge, { duration: 100, delay: tA });
    M.voar(ctx, r.ia, [{ x: 1350, y: 140 }, { x: 930, y: 250 }, { x: 430, y: 452 }, { x: L.x + 34, y: L.y - 12 }, L], VOO, { atraso: tA, estado: 'disparando', curva: E.outCubic });
    ctx.em(tA, () => s.gliss({ de: 440, para: 1320, dur: 0.6, ganho: 0.1 }));
    ctx.em(tA + VOO, () => { s.novoJogador(); anel(ctx, L.x, L.y, CIANO, 3.4); r.h.alerta(true); });
    ctx.em(tA + VOO + 250, () => r.hud.entrarJogadores(ctx));
    ctx.em(tA + VOO + 700, () => r.h.alerta(false));
    ctx.em(tA + VOO + 1300, ctx.concluir);
  }

  /* ---------- passo 1: aposta da turma. Nada se move: só a pergunta e as três opções ---------- */
  function tocar1(ctx) {
    const s = ctx.som, d = r.aposta.entrar(ctx, 0);
    s.bipe({ freq: 660, dur: 0.12 });
    [0, 1, 2].forEach(i => ctx.em(380 + i * 140, () => s.bipe({ freq: 880 + i * 110, dur: 0.07, ganho: 0.1 })));
    [0, 1].forEach(i => ctx.em(d + 300 + i * 520, () => s.bipe({ freq: 880, dur: 0.09, ganho: 0.09 })));   // bipe de espera
    ctx.em(d + 300 + 520 + 400, ctx.concluir);
  }

  /* ---------- passo 2: a resposta. A IA dispara pelos degraus 2, 3 e 4; o herói sobe atrás; cartão dos três números ---------- */
  function tocar2(ctx) {
    const s = ctx.som, tp = r.tp, T0 = 750, BATIDA = 400, VOO = 240, P4 = pouso(4);
    r.aposta.el.classList.remove('c02-espera'); r.aposta.revelar(ctx);
    s.bipe({ freq: 1320, dur: 0.14, ganho: 0.13 }); s.bipe({ t: 0.15, freq: 1760, dur: 0.24, ganho: 0.11 });
    /* um degrau por batida: a faísca dispara, as tarefas acendem, as saídas se escrevem; arpejo subindo */
    let de = lado(BASE);
    DISPARO.forEach((k, i) => {
      const t = T0 + i * BATIDA, origem = de;
      M.voar(ctx, r.ia, [origem, pairo(k)], VOO, { atraso: t, estado: 'disparando', aoFim: 'voando' });
      ctx.em(t, () => s.flauta({ freq: s.penta(3 + i * 2, 440), dur: 0.2, ganho: 0.2 }));
      rajada(ctx, k, t);
      de = pairo(k);
    });
    M.voar(ctx, r.ia, [de, lado(P4)], 280, { atraso: T0 + (DISPARO.length - 1) * BATIDA + VOO + 140, estado: 'voando' });
    /* o herói sobe atrás, correndo; o prazo quase não cai */
    const tH = T0 + 150, SOBE = 1450;
    M.andar(ctx, r.h, rota(0, 4), SOBE, { atraso: tH, marcas: tp.marcasDePouso(0, 4, k => r.hud.mudarFase(ctx, k)), ganho: 0.2 });
    r.hud.gastarPrazo(ctx, PRAZO[2], SOBE, tH);
    /* a aposta dá lugar ao cartão dos três números, no mesmo lugar */
    const tC = tH + SOBE + 250;
    ctx.anim(r.aposta.el, [{ opacity: 1, transform: 'translateY(0px)' }, { opacity: 0, transform: 'translateY(-24px)' }], { duration: 300, delay: tC - 300, easing: 'ease-in' });
    const t0 = tC + r.tres.entrar(ctx, tC) + 60;
    r.nums.forEach((el, i) => { ctx.anim(el, POP, { duration: 300, delay: t0 + i * 380, easing: 'ease-out' }); ctx.em(t0 + i * 380, () => s.clac({ tom: 0.9 + i * 0.12, ganho: 0.3 })); });
    r.tres.revelar(ctx, 'rodape', t0 + 3 * 380 + 120);
    ctx.em(t0 + 3 * 380 + 120 + 340 + 900, ctx.concluir);
  }

  /* ---------- passo 3: a IA faz o degrau 5; a pedra cai, desfaz o degrau e derruba o herói; a IA o leva de volta num instante ---------- */
  function tocar3(ctx) {
    const s = ctx.som, tp = r.tp, pedra = r.pedra, G = GOLPE, K = DEGRAU_DA_PEDRA, P4 = pouso(K - 1), P5 = pouso(K);
    r.tres.sair(ctx);
    M.voar(ctx, r.ia, [lado(P4), pairo(K)], 240, { atraso: 150, estado: 'disparando', aoFim: 'voando' });
    ctx.em(150, () => s.flauta({ freq: s.penta(9, 440), dur: 0.2, ganho: 0.2 }));
    rajada(ctx, K, 150);
    M.voar(ctx, r.ia, [pairo(K), lado(P5)], 240, { atraso: 560, estado: 'voando' });
    M.andar(ctx, r.h, rota(K - 1, K), 520, { atraso: 300, marcas: tp.marcasDePouso(K - 1, K, k => r.hud.mudarFase(ctx, k)), ganho: 0.2 });
    /* a pedra chega pela direita e fica parada, com o texto inteiro, pelo tempo de leitura */
    const tE = 520, tL = tE + pedra.chegar(ctx, 'desliza', tE), tG = tL + 1750, tI = tG + G.ms;
    ctx.em(tE, () => s.gliss({ de: 980, para: 520, dur: 0.3, ganho: 0.1 }));
    ctx.em(tL + 60, () => r.h.alerta(true));
    let bob = null; ctx.em(tL, () => { bob = pedra.flutuar(ctx); });
    M.voar(ctx, r.ia, [lado(P5), IA_ESQUIVA], 260, { atraso: tG - 320, estado: 'voando' });   // a faísca sai da frente
    ctx.em(tG, () => { if (bob) bob.cancel(); pedra.golpear(ctx, G); });
    ctx.em(tI, () => {
      const ix = P5.x + 6, iy = P5.y - 62;
      s.pedra({ ganho: 0.85 }); tp.tremor(ctx, 7, 300);
      tp.poeira(ctx, ix, iy + 44, 10, 1.3); tp.estilhacos(ctx, ix + 16, iy - 8, 9);
      pedra.desfazer(ctx, G);
      r.h.alerta(false).estado('atingido');                                // quadro parado: dá peso à pancada
      desfazerDegrau(ctx, K);
      ctx.em(r.lasca.cravar(ctx, ix, iy), () => { s.clac({ tom: 0.7, ganho: 0.5 }); tp.poeira(ctx, LASCA.x + 12, LASCA.y + 24, 5, 0.8); });
      ctx.em(120, () => { r.hud.perderVida(ctx); s.vida(); });
      r.hud.gastarPrazo(ctx, PRAZO[3] + 0.01, 400, 150);
      /* volta um degrau só */
      const ROLA = 680, LEVANTA = 440;
      ctx.em(130, () => M.rolar(ctx, r.h, rota(K, K - 1), ROLA, { voltas: 1, quique: 9, saltos: 2, curva: E.outQuad,
        fim: () => { r.hud.mudarFase(ctx, K - 1); r.h.por(P4.x, P4.y).estado('agachado'); M.levantar(ctx, r.h, 120, LEVANTA - 120); r.h.piscar(ctx, 440, 60); } }));   // para de piscar antes de ser puxado
      /* a faísca mergulha até ele e o leva de volta */
      M.voar(ctx, r.ia, [IA_ESQUIVA, lado(P4)], 320, { atraso: 430, estado: 'disparando' });
      const tP = 130 + ROLA + LEVANTA + 120, PUXA = 420;
      ctx.em(tP, () => { puxar(ctx, K - 1, K, PUXA); r.hud.gastarPrazo(ctx, PRAZO[3], PUXA); });
      ctx.em(tP + PUXA, () => r.hud.mudarFase(ctx, K));
      r.frase3.entrar(ctx, tP + PUXA + 180);
      ctx.em(tP + PUXA + 180 + 520 + 1000, ctx.concluir);
    });
  }

  /* ================= Parte 4: passos 4 e 5 e o registro da cena ================= */
  /* a luz enfraquece no degrau k: a faísca pisca e fica fraca; os degrauzinhos tentam acender e apagam; tom que cai e some */
  function enfraquecer(ctx, k, t) {
    [0, 90, 170, 260, 330].forEach((d, i) => ctx.em(t + d, () => r.ia.estado(i % 2 ? 'parada' : 'fraca')));   // termina fraca
    r.tp.tarefasK[k - 1].forEach((g, q) => ctx.anim(g.firstElementChild, [{ fill: r.corTarefa }, { fill: CIANO, offset: 0.2 }, { fill: r.corTarefa, offset: 0.45 }, { fill: CIANO, offset: 0.6 }, { fill: r.corTarefa }], { duration: 520, delay: t + q * 30, fill: 'none' }));
    ctx.anim(r.luz[k - 1], [{ opacity: 0 }, { opacity: 0.6 }, { opacity: 0 }, { opacity: 0.4 }, { opacity: 0 }], { duration: 520, delay: t, fill: 'none' });
    ctx.em(t, () => ctx.som.gliss({ de: k === 1 ? 660 : 494, para: k === 1 ? 165 : 110, dur: 0.75, ganho: 0.15 }));
  }
  /* o degrau continua do analista: o contorno branco se desenha em volta dele, com um tambor do mundo 1 */
  function marcarSeu(ctx, i, t) {
    const el = r.seus[i], k = SEUS[i], per = parseFloat(el.getAttribute('stroke-dasharray'));
    ctx.anim(el, [{ opacity: 0, strokeDashoffset: per }, { opacity: 1, strokeDashoffset: per * 0.92, offset: 0.08 }, { opacity: 1, strokeDashoffset: 0 }], { duration: 460, delay: t, easing: 'ease-out' });
    ctx.anim(r.tp.flashes[k - 1], [{ opacity: 0 }, { opacity: 0.3 }, { opacity: 0 }], { duration: 600, delay: t, fill: 'none' });
    ctx.anim(r.tp.fases[k - 1], [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 420, delay: t, fill: 'none', easing: 'ease-out' });
    ctx.em(t, () => ctx.som.tambor({ freq: k === 1 ? 58 : 110, ganho: 0.6 }));
  }

  /* ---------- passo 4: a luz da IA enfraquece no degrau 1 e no degrau 6; o herói sobe o último degrau sozinho ---------- */
  function tocar4(ctx) {
    const s = ctx.som, tp = r.tp, K = DEGRAU_DA_PEDRA, V1 = 430, V6 = 520;
    r.frase3.sair(ctx); ctx.anim(r.lasca.el, some, { duration: 300 });
    /* desce até o degrau 1: a luz enfraquece */
    M.voar(ctx, r.ia, [lado(pouso(K)), { x: 330, y: 400 }, IA_D1], V1, { atraso: 150, estado: 'disparando' });
    ctx.em(150, () => s.chip({ tipo: 'triangle', freq: 990, ate: 330, dur: 0.35, ganho: 0.12 }));
    enfraquecer(ctx, 1, 150 + V1 + 60);
    marcarSeu(ctx, 0, 150 + V1 + 420);
    /* volta pelos degraus do meio, com a luz cheia, e tenta o degrau 6: enfraquece de novo */
    const t6 = 150 + V1 + 900;
    M.voar(ctx, r.ia, [IA_D1, { x: 300, y: 420 }, { x: 480, y: 250 }, IA_D6], V6, { atraso: t6, estado: 'disparando' });
    ctx.em(t6, () => s.chip({ tipo: 'triangle', freq: 330, ate: 990, dur: 0.4, ganho: 0.12 }));
    enfraquecer(ctx, 6, t6 + V6 + 60);
    marcarSeu(ctx, 1, t6 + V6 + 420);
    /* ela recua, fraca, e fica para trás */
    const tR = t6 + V6 + 800;
    M.voar(ctx, r.ia, [IA_D6, IA_FRACA], 480, { atraso: tR, estado: 'fraca', aoFim: 'fraca' });
    /* o herói sobe o último degrau sozinho, no passo do mundo 1: é aqui que o prazo mais cai */
    const tS = tR + 150, SOBE = 1500;
    M.andar(ctx, r.h, rota(K, 6), SOBE, { atraso: tS, marcas: tp.marcasDePouso(K, 6, k => r.hud.mudarFase(ctx, k)) });
    r.hud.gastarPrazo(ctx, PRAZO[4], SOBE, tS);
    /* cartão dos estudos, à direita, e a frase */
    const tC = tS + 250, t0 = tC + r.estudos.entrar(ctx, tC) + 60;
    r.estL.forEach((el, i) => {
      ctx.anim(el, [{ opacity: 0, transform: 'translateX(-16px)' }, { opacity: 1, transform: 'translateX(0px)' }], { duration: 340, delay: t0 + i * 420, easing: 'ease-out' });
      ctx.em(t0 + i * 420, () => s.clac({ tom: i ? 0.8 : 1.2, ganho: 0.3 }));
    });
    r.estudos.revelar(ctx, 'rodape', t0 + 3 * 420);
    r.frase4.entrar(ctx, t0 + 3 * 420 + 380);
    ctx.em(t0 + 3 * 420 + 380 + 520 + 900, ctx.concluir);
  }

  /* ---------- passo 5: topo. Fanfarra, o prêmio brilhando; por um instante ele falha, como imagem com defeito ---------- */
  function tocar5(ctx) {
    const s = ctx.som, tp = r.tp, tV = 240, VOO = 560;
    r.estudos.sair(ctx); r.frase4.sair(ctx);
    /* a faísca recupera a luz, cruza o topo e deixa o prêmio */
    [0, 80, 160].forEach((d, i) => ctx.em(d, () => r.ia.estado(i % 2 ? 'fraca' : 'parada')));
    M.voar(ctx, r.ia, [IA_FRACA, { x: PREMIO.x, y: 226 }, IA_TOPO], VOO, { atraso: tV, estado: 'disparando' });
    ctx.em(tV, () => s.chip({ tipo: 'triangle', freq: 440, ate: 1320, dur: 0.4, ganho: 0.12 }));
    ctx.anim(r.premio.el, [{ opacity: 0, transform: 'scale(.2)' }, { opacity: 1, transform: 'scale(1.18)', offset: 0.7 }, { opacity: 1, transform: 'scale(1)' }], { duration: 420, delay: tV + 300, easing: 'ease-out' });
    ctx.em(tV + 300, () => { anel(ctx, PREMIO.x, PREMIO.y - 66, CIANO, 4); s.fanfarra(); });
    ctx.em(tV + 600, () => { anel(ctx, PREMIO.x, PREMIO.y - 66, '#fff', 5.5); tp.poeira(ctx, PREMIO.x, PREMIO.y, 8, 1.2); });
    ctx.anim(r.brilho, surge, { duration: 500, delay: tV + 520, easing: 'ease-out' });
    /* "Fase concluída" bate na tela; o herói comemora */
    const tB = 900;
    ctx.anim(r.fc, [{ opacity: 0, transform: 'scale(1.7)' }, { opacity: 1, transform: 'scale(.94)', offset: 0.7 }, { opacity: 1, transform: 'scale(1)' }], { duration: 430, delay: tB, easing: 'cubic-bezier(.5,0,.8,.4)' });   // cresce a partir da direita: não sai do palco
    ctx.em(tB + 300, () => { tp.tremor(ctx, 4, 220); s.tambor({ freq: 96, ganho: 0.7, dur: 0.5 }); });
    ctx.tween(760, e => r.h.por(TOPO.x, TOPO.y - Math.abs(Math.sin(Math.PI * 2 * e)) * 22).pose('parado', { br: -8 + 160 * Math.sin(Math.PI * e), cb: -10 * Math.sin(Math.PI * e) }),
      { atraso: tB + 150, fim: () => r.h.por(TOPO.x, TOPO.y).estado('parado') });
    const tR = tB + 900;
    ctx.anim(r.rotulo, POP, { duration: 300, delay: tR, easing: 'ease-out' });
    ctx.em(tR, () => s.clac({ tom: 1.1, ganho: 0.3 }));
    /* por um instante, o prêmio falha: a imagem se parte em faixas e treme; o herói repara */
    const tF = tR + 1000;
    ctx.em(tF, () => {
      s.falha(); r.premio.falhar(ctx, 560, 'inteiro'); r.h.alerta(true);
      ctx.anim(r.premio.el, pisca([1, 0.55, 1, 0.7, 1, 0.5, 1]).map((q, i) => Object.assign(q, { transform: `translateX(${[0, -7, 5, -3, 6, -4, 0][i]}px)` })), { duration: 560, fill: 'none' });
      ctx.anim(r.brilho, pisca([0.1, 0.9, 0.1, 0.6, 0.1, 0.1, 1]), { duration: 560, fill: 'none' });   // o brilho apaga junto
    });
    ctx.em(tF + 860, () => { s.falha({ ganho: 0.2 }); r.premio.falhar(ctx, 160, 'inteiro'); ctx.anim(r.brilho, pisca([0.1, 1]), { duration: 160, fill: 'none' }); });
    ctx.em(tF + 1250, () => r.h.alerta(false));
    r.pergunta.entrar(ctx, tF + 1350);
    ctx.em(tF + 1350 + 520 + 1000, ctx.concluir);
  }

  Deck.registrar({
    id: '02',
    entrada: 'seca',                                              // a cena redesenha a tela "Continuar?" do mundo 1 e a desfaz no passo 0: sem cortina
    titulo: '02 · Mundo 2 — O aliado: a IA entra no jogo',
    notas: {
      fala: '"Continuar? Então entra o segundo jogador. [aposta] Num experimento com 758 consultores do BCG, quem usou IA terminou vinte e cinco por cento mais rápido, fez doze por cento mais tarefas e entregou com mais de quarenta por cento de qualidade a mais. Eram consultores, não analistas de dados, mas o desenho é o mesmo: os degraus do meio viram segundos. A pedra ainda cai, só que voltar ficou barato. Agora reparem onde a luz dela enfraquece. Num mapeamento dos estudos sobre IA no ciclo de dados, quarenta e um tratam de exploração; três tratam de definir o problema; um, de implantação. O primeiro e o último degrau continuam seus. E chegamos. Fase concluída. [pausa] Quem entregaria isso ao chefe agora?" (cerca de 90 s)',
      interacao: 'Passo 1: "com IA, quanto mais rápido? Dez, vinte e cinco ou cinquenta por cento?". Mão levantada para cada opção, antes da tecla. Passo 5: "quem entregaria isso ao chefe agora?". Mão levantada. Não responder: a resposta é o mundo 3.',
      rastreio: [
        '25,1% mais rápido, +12,2% de tarefas concluídas, mais de 40% de ganho de qualidade, 758 consultores, três braços: pesquisa/03-ia-na-analise-de-dados.md §3.1. Na tela os dois primeiros estão arredondados para 25% e 12%.',
        '41 de análise exploratória, 33 de modelos, 23 de coleta e preparação, 3 de definição do problema, 1 de implantação: Chintakunta, Nascimento & Guimaraes (arXiv 2508.11698), §5.1, conferido na fonte em 2026-10-08. Um artigo pode contar em mais de uma etapa.',
        'O total de artigos fica fora da tela e da fala. pesquisa/01 §15.1 diz 62 e pesquisa/03 §1.1 diz 66. A divergência é do próprio artigo: o texto fala em "a corpus of 66 research papers" e as legendas de duas figuras usam "out of 62 papers", sem explicar a diferença.',
        'A IA vai bem em entendimento dos dados, preparação e modelagem, com "partial correctness" em cenários complexos (Musazade et al., 2024): pesquisa/03 §2. É o que sustenta os degraus 2, 3 e 4.',
        'Ilustrativo, sem fonte: a pedra do passo 3 e a frase "só ficou barato".'
      ]
    },
    montar, desmontar,
    passos: [
      { nome: 'sai da tela "Continuar?" do mundo 1; o HUD reinicia; herói na base; a faísca chega · 2 jogadores', ambiente: { vento: 0.45 }, tocar: tocar0, fim: FIM[0] },
      { nome: 'aposta da turma · "Com IA, quanto mais rápido?" · 10%, 25%, 50%', tocar: tocar1, fim: FIM[1] },
      { nome: 'a resposta: 25% · a IA dispara pelos degraus 2, 3 e 4 · cartão dos três números', tocar: tocar2, fim: FIM[2] },
      { nome: 'pedra no degrau 5 · "Os dados estavam incompletos." · volta um degrau e a IA o leva de volta', tocar: tocar3, fim: FIM[3] },
      { nome: 'a luz da IA enfraquece no degrau 1 e no degrau 6 · o herói sobe o último sozinho · cartão dos estudos', tocar: tocar4, fim: FIM[4] },

  });
})();


/* ================================================================

(() => {

  /* ---------- conteúdo (roteiro) ---------- */
  const VIDAS = 5, FASE = 6;                                 // o herói está no topo: fase 6/6
  /* os quatro baús: fala da IA (balão), nome e texto da armadilha (cartão) e número (rodapé do cartão). Texto exato.

  /* os 9 passos do roteiro. `bau` = índice do baú em cena. `espera` = o baú chegou e fica fechado até a tecla
     (baús 1 e 3: a pausa da pergunta "abre ou não abre?" é do apresentador); sem `espera`, o passo termina com a armadilha aberta */
  const PASSOS = [
    {},                                                      // 0 · o prêmio era falso; a noite cai

  ];
  /* quantos baús já foram abertos ao fim de cada passo: 0, 0, 1, 2, 2, 3, 4, 4, 4. A vida só cai na abertura */
  const ABERTOS = PASSOS.map((_, p) => PASSOS.slice(0, p + 1).filter(q => q.bau != null && !q.espera).length);
  /* prazo ao fim de cada passo, de 1 (cheio) a 0: ilustrativo, sem número na tela. O roteiro não fixa: escolha da cena.
     Cada armadilha e a queda na fronteira custam um pouco de tempo; aqui quem acaba são as vidas, não o prazo */
  const PRAZO = [1, 1, 0.86, 0.72, 0.72, 0.58, 0.44, 0.34, 0.34];

  /* ---------- geometria própria da cena (px do palco) ---------- */
  const TOPO = pouso(6), TY = TOPO.y;                        // (660, 280): quadro combinado com o fim da cena 02
  const PREMIO = { x: 564, y: TY, escala: 1.1 };
  const lado = x => ({ x: x + 74, y: TY - 96 });             // a faísca parada ao lado do herói: (734, 184) no início
  /* o topo só tem 200 px (510 a 710). O presente chega no ar, à direita, na luz da faísca;
     cada armadilha joga o herói um pouco mais para trás, até a beira */
  const RECUO = [TOPO.x, 636, 608, 578, 546];                // x do herói com 0, 1, 2, 3 e 4 baús abertos
  const ABRE = 684;                                          // onde ele para para abrir o baú
  const BAU = { x: 760, y: 284, escala: 0.85 };
  const ENTREGA = { x: BAU.x - 42, y: BAU.y - 104 };         // a faísca com o feixe aceso sobre o baú
  const FALA = { x: 838, y: 216 };                           // a faísca ao lado do presente, falando
  const BALAO = { x: FALA.x + 28, y: FALA.y - 26 };
  const CARTAO = { x: 884, y: 206, largura: 366, rot: [-1, 0.8, -0.7, 1] };
  const MARCA = { x: 56, y: [166, 220, 274, 328], rot: [-1.1, 0.8, -0.6, 1] };
  /* a fronteira (passo 7): ele sai da beira, cruza a linha, pisa em falso e cai ali mesmo */
  const LINHA_X = 580, FALSO = 620, QUEDA = 664;
  let r = null;                                              // referências do DOM montado

  /* ================= Parte 2: montagem (estado ANTES do passo 0) e estado final de cada passo ================= */
  /* luz sob o presente (da IA, por isso ciano), a linha da fronteira e a faixa de chão que pisca no passo em falso */
  function desCenario() {
    const b = BAU, t = pouso(6);
    return `<defs><radialGradient id="c03-luz-g"><stop offset="0" stop-color="#00A1B8" stop-opacity=".75"/><stop offset=".6" stop-color="#00A1B8" stop-opacity=".25"/><stop offset="1" stop-color="#00A1B8" stop-opacity="0"/></radialGradient></defs>
      <g class="c03-luz"><ellipse cx="${b.x}" cy="${b.y + 7}" rx="70" ry="17" fill="url(#c03-luz-g)"/>
        <ellipse cx="${b.x}" cy="${b.y + 5}" rx="50" ry="8.5" fill="none" stroke="#00A1B8" stroke-width="2.4" opacity=".9"/></g>
      <rect class="c03-piso" x="${LINHA_X}" y="${TY - 1}" width="${t.x + 50 - LINHA_X}" height="7" fill="#ECEDFF"/>
      <g class="c03-linha"><path d="M${LINHA_X},${TY - 14} V${TY - 124}" fill="none" stroke="#00010F" stroke-width="9" stroke-linecap="round" stroke-dasharray="12 10" opacity=".6"/>
        <path d="M${LINHA_X},${TY - 14} V${TY - 124}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10"/>
        <polygon points="${LINHA_X - 10},${TY} ${LINHA_X},${TY - 11} ${LINHA_X + 10},${TY} ${LINHA_X},${TY + 11}" fill="#fff" stroke="#00010F" stroke-width="1.8" stroke-linejoin="round"/></g>`;
  }
  /* brilhos do presente fechado, enquanto ele espera a tecla: piscam por CSS (c03-on); parados, ficam invisíveis */
  function desBrilhos() {
    return [[-8, -88, 0], [42, -70, 0.7], [26, -26, 1.3], [-24, -44, 1.8]].map(([dx, dy, atraso]) =>
      `<g transform="translate(${BAU.x + dx} ${BAU.y + dy})"><path class="c03-brilho" style="animation-delay:-${atraso}s" opacity="0" d="M0,-11 L2.6,-2.6 L11,0 L2.6,2.6 L0,11 L-2.6,2.6 L-11,0 L-2.6,-2.6 Z" fill="#fff" stroke="#00010F" stroke-width="1"/></g>`).join('');
  }
  function montar(palco) {
    const tp = Templo.criar(palco, { classe: 'c03', hora: 'amanhecer', construido: true, degrauzinhos: true, pilha: true });
    const H = tp.hud;
    r = { tp };
    /* acima do mundo, na ordem de empilhamento */
    r.cab = Jogo.cabecalho(H, { eyebrow: 'Mundo 3', titulo: 'O trapaceiro: a IA erra com convicção' });
    r.marcas = BAUS.map((b, i) => { const m = Jogo.lasca(H, { linhas: [b.nome], x: MARCA.x, y: MARCA.y[i], rot: MARCA.rot[i] }); m.el.classList.add('c03-marca'); return m; });
    r.cartoes = BAUS.map((b, i) => {
      const c = Jogo.cartao(H, { cabecalho: b.nome + ':', linhas: [b.texto], rodape: b.numero, x: CARTAO.x, y: CARTAO.y, largura: CARTAO.largura, rot: CARTAO.rot[i] });
      c.el.classList.add('c03-arm'); return c;
    });
    r.fronteira = Jogo.cartao(H, { linhas: FRONTEIRA.linhas, rodape: FRONTEIRA.rodape, x: CARTAO.x, y: CARTAO.y, largura: CARTAO.largura, rot: -0.8 });
    r.fronteira.el.classList.add('c03-front');
    r.frases = [Jogo.frase(H, { texto: FRASES[0], acento: true, y: 600 }), Jogo.frase(H, { texto: FRASES[1], y: 653 })];
    r.frases[1].el.classList.add('c03-fecho');
    Jogo.logo(H);
    r.hud = Jogo.hud(H, { vidas: VIDAS, fases: Templo.FASES.map(f => f.nome), jogadores: ['Analista', { nome: 'IA', ia: true }] });
    r.coracoes = Array.from(r.hud.el.querySelectorAll('.jg-cor svg'));
    /* atores, na ordem de empilhamento: cenário da cena, prêmio, baús, brilhos, herói, faísca */
    r.cenario = svg('g', { class: 'c03-cenario' }); r.cenario.innerHTML = desCenario(); tp.atores.appendChild(r.cenario);
    r.luz = r.cenario.querySelector('.c03-luz'); r.linha = r.cenario.querySelector('.c03-linha'); r.piso = r.cenario.querySelector('.c03-piso');
    r.premio = Jogo.premio(tp.atores, { escala: PREMIO.escala });
    r.baus = BAUS.map(() => Jogo.bau(tp.atores, { escala: BAU.escala }));
    r.fantasma = Jogo.bau(tp.atores, { escala: BAU.escala });               // os recortes que "não deram" (baú 4)
    r.brilhos = svg('g', { class: 'c03-brilhos' }); r.brilhos.innerHTML = desBrilhos(); tp.atores.appendChild(r.brilhos);
    r.h = Jogo.heroi(tp.atores, { escala: 1 });
    r.ia = Jogo.aliado(tp.atores, { escala: 1 });
    /* no plano do templo, acima dos atores: a fala da IA */
    r.baloes = BAUS.map(b => Jogo.balao(tp.topo, { texto: b.fala, x: BALAO.x, y: BALAO.y }));
    estadoInicial();
  }
  function desmontar() { r = null; }

  /* ---------- estado ---------- */
  const op = (el, v) => { el.style.opacity = v; };
  /* pose de abrir o baú: o braço da frente sobe até a tampa (a camada de jogo não tem essa pose).
     MAO = quanto do gesto está feito enquanto ele espera a tecla: a mão perto da tampa, sem tocar */
  const POSE_ABRE = { cA: 16, kA: 6, cB: -14, kB: 10, br: -20, ab: 14, bf: 82, tr: 10, cb: 4 }, MAO = 0.55;
  /* o herói da camada de jogo só olha para a direita. Para ele se virar, a cena espelha o <g> dele em torno do x dos pés */
  function heroiEm(x, y, virado) {
    r.h.el.setAttribute('transform', virado ? `translate(${Math.round(2 * x * 10) / 10},0) scale(-1,1)` : 'translate(0,0)');
    return r.h.por(x, y);
  }
  /* espera pela tecla (passos 1 e 4): o baú i flutua, a luz pulsa e os brilhos piscam. É animação CSS, que continua
     depois que o passo termina. Com parado=1 e na impressão ela não roda: fica o baú fechado na luz, que é o quadro do fim() */
  function esperar(i, v) {
    r.baus.forEach((b, k) => b.el.classList.toggle('c03-flutua', !!v && k === i));
    r.luz.classList.toggle('c03-pulsa', !!v); r.brilhos.classList.toggle('c03-on', !!v);
  }
  /* o quadro em que a cena 02 termina: amanhecer, herói no topo, prêmio inteiro, faísca parada ao lado. HUD já recarregado */
  function estadoInicial() {
    r.cab.definir(false);
    r.hud.definir({ visivel: true, vidas: VIDAS, fase: FASE, prazo: PRAZO[0], jogadores: true });
    r.premio.por(PREMIO.x, PREMIO.y).estado('inteiro').mostrar(true);
    heroiEm(TOPO.x, TY, false).estado('parado').alerta(false).mostrar(true);
    const l = lado(TOPO.x); r.ia.por(l.x, l.y).estado('parada').mostrar(true);
    r.baus.forEach(b => b.por(BAU.x, BAU.y).estado('fechado').mostrar(false));
    r.fantasma.por(BAU.x, BAU.y).estado('fechado').mostrar(false);
    [r.luz, r.linha, r.piso].forEach(el => op(el, 0));
  }
  /* estado final do passo p, inteiro e na hora. É absoluto (não depende do passo anterior), então o fim natural,
     o pulo e o link direto dão sempre no mesmo quadro */
  function estadoFinal(p) {
    const tp = r.tp, P = PASSOS[p], abertos = ABERTOS[p], marcas = p > 0 ? ABERTOS[p - 1] : 0;
    const temBau = P.bau != null, espera = !!P.espera, hx = P.fronteira ? QUEDA : espera ? ABRE : RECUO[abertos];
    tp.hora('noite'); tp.camera(0, 0, 0, true);
    r.cab.definir(true);
    r.premio.estado('desfeito').mostrar(false);
    r.hud.definir({ visivel: true, vidas: VIDAS - abertos, fase: FASE, prazo: PRAZO[p], jogadores: true });
    r.coracoes.forEach((c, i) => c.classList.toggle('c03-ultima', !!P.fecho && i === 0));
    /* depois do passo 0 o herói olha para onde o prêmio estava; à espera da tecla, está diante do baú com a mão estendida */
    heroiEm(hx, TY, p === 0).alerta(false).mostrar(true);
    if (espera) r.h.mistura('parado', POSE_ABRE, MAO); else r.h.estado('parado');
    const ia = temBau ? FALA : lado(hx);
    r.ia.por(ia.x, ia.y).estado('parada').mostrar(true);
    BAUS.forEach((_, i) => {
      const atual = P.bau === i;                                          // o baú deste passo: fechado (espera) ou aberto, com a fala
      r.baus[i].por(BAU.x, BAU.y).estado(atual && !espera ? 'armadilha' : 'fechado').mostrar(atual);
      r.baloes[i].definir(atual);
      r.cartoes[i].definir({ visivel: atual && !espera });                // o cartão só entra quando a armadilha abre
      r.marcas[i].fixar(i < marcas);                                      // no passo seguinte, o cartão vira a marca com o nome
    });
    r.fantasma.mostrar(false);
    esperar(P.bau, espera);
    op(r.luz, temBau ? 1 : 0); op(r.piso, 0);
    op(r.linha, P.fronteira ? 1 : 0); r.linha.style.transform = 'none';
    r.fronteira.definir({ visivel: !!P.fronteira });
    r.frases.forEach(f => f.definir(!!P.fecho));
  }
  const FIM = PASSOS.map((_, p) => () => estadoFinal(p));

  /* ================= Parte 3: os passos ================= */
  const some = [{ opacity: 1 }, { opacity: 0 }], surge = [{ opacity: 0 }, { opacity: 1 }];
  const n1 = v => Math.round(v * 10) / 10;
  const pisca = vals => vals.map((v, k) => ({ opacity: v, offset: k / (vals.length - 1), easing: 'step-end' }));
  /* na beira do topo: o corpo vai para trás, sobre o vazio, e volta */
  const POSE_BEIRA_TRAS = { cA: 14, kA: 4, cB: -4, kB: 6, br: 140, ab: 20, bf: 76, tr: -24, cb: -14, olho: 'x' };
  const POSE_BEIRA_FRENTE = { cA: 22, kA: 18, cB: -10, kB: 14, br: -44, ab: 30, bf: 44, tr: 18, cb: 8 };

  /* pulinho no lugar (virar-se, levar um susto) */
  function salto(ctx, x, alt, ms, virado) { ctx.tween(ms, e => heroiEm(x, TY - 4 * alt * e * (1 - e), virado), { fim: () => heroiEm(x, TY, virado) }); }
  /* anel de luz que abre e some */
  function clarao(ctx, x, y, raio, ms) {
    const c = svg('circle', { cx: x, cy: y, r: raio, fill: 'none', stroke: '#fff', 'stroke-width': 6, class: 'c03-fx' });
    r.tp.fx.appendChild(c); ctx.temp(c);
    const a = ctx.anim(c, [{ transform: 'scale(.35)', opacity: 1 }, { transform: 'scale(2.4)', opacity: 0 }], { duration: ms || 420, easing: 'ease-out' });
    if (a) a.onfinish = () => ctx.soltar(c);
  }
  /* brilhos em volta do presente fechado, nos baús que abrem direto: até abrir, é um presente */
  function brilhos(ctx, t0, n) {
    const P = [[-52, -74], [50, -86], [58, -30], [-58, -24], [4, -100], [-30, -96]];
    for (let k = 0; k < n; k++) ctx.em(t0 + k * 330, () => {
      const [dx, dy] = P[k % P.length];
      const g = svg('path', { d: 'M0,-11 L2.6,-2.6 L11,0 L2.6,2.6 L0,11 L-2.6,2.6 L-11,0 L-2.6,-2.6 Z', fill: '#fff', stroke: '#00010F', 'stroke-width': 1 });
      r.tp.fx.appendChild(g); ctx.temp(g);
      const p = `translate(${BAU.x + dx}px,${BAU.y + dy}px)`;
      const a = ctx.anim(g, [{ opacity: 0, transform: `${p} scale(.2) rotate(0deg)` }, { opacity: 1, transform: `${p} scale(1) rotate(40deg)`, offset: 0.45 }, { opacity: 0, transform: `${p} scale(.2) rotate(90deg)` }], { duration: 620, easing: 'ease-in-out' });
      if (a) a.onfinish = () => ctx.soltar(g);
    });
  }

  /* ---------- passo 0: o prêmio era falso; a noite cai ---------- */
  /* silhueta aproximada da taça (escala 1, base em 0,0), para os pedaços nascerem com a forma dela */
  function naTaca(x, y) {
    const ax = Math.abs(x);
    if (y < -102 || y > 0) return false;
    if (y <= -64) return ax <= 31 || (ax >= 36 && ax <= 50 && y >= -94);
    if (y <= -40) return ax <= 27 * Math.sqrt(Math.max(0, 1 - Math.pow((y + 64) / 26, 2))) + 2;
    if (y <= -19) return ax <= 6;
    return ax <= (y <= -9 ? 21 : 30);
  }
  function desfazerPremio(ctx) {
    const tp = r.tp, s = ctx.som, rnd = rng(303), k = PREMIO.escala, C = 9;
    ctx.anim(r.premio.el, pisca([1, 0.25, 0.9, 0]), { duration: 240 });
    for (let y = -100; y < 0; y += C) for (let x = -50; x < 50; x += C) {
      if (!naTaca(x + C / 2, y + C / 2)) continue;
      const q = svg('rect', { x: n1(PREMIO.x + x * k), y: n1(PREMIO.y + y * k), width: n1(C * k - 1), height: n1(C * k - 1), fill: rnd() < 0.3 ? '#A9AADC' : rnd() < 0.5 ? '#E3E2FD' : '#F6F6FF', class: 'c03-fx' });
      tp.fx.appendChild(q); ctx.temp(q);
      const espera = 120 + (1 - y / -100) * 60 + rnd() * 420, dx = (rnd() - 0.5) * 70, cai = -y * k + 6 + rnd() * 26, gira = (rnd() - 0.5) * 240;
      const a = ctx.anim(q, [{ opacity: 1, transform: 'translate(0px,0px) rotate(0deg)', easing: 'cubic-bezier(.55,0,1,.6)' }, { opacity: 0.9, transform: `translate(${n1(dx)}px,${n1(cai)}px) rotate(${n1(gira)}deg)`, offset: 0.75 }, { opacity: 0, transform: `translate(${n1(dx * 1.2)}px,${n1(cai + 4)}px) rotate(${n1(gira)}deg)` }],
        { duration: 520 + rnd() * 380, delay: espera });
      if (a) a.onfinish = () => ctx.soltar(q);
    }
    tp.estilhacos(ctx, PREMIO.x, PREMIO.y - 74, 8, 0.7);
    ctx.em(420, () => tp.poeira(ctx, PREMIO.x, PREMIO.y - 4, 9, 1.2));
    s.falha({ ganho: 0.34 });
    [0, 1, 2, 3, 4, 5].forEach(i => s.chip({ t: 0.1 + i * 0.07, freq: 880 - i * 120, dur: 0.05, ganho: 0.07 }));
  }
  function tocar0(ctx) {
    const s = ctx.som, tp = r.tp, tF1 = 700, tF2 = 1650, tD = 2350, tN = 3050, NOITE = 2600;
    s.ambiente({ vento: 0.4 }, 1);
    /* mundo novo: os corações do HUD pulsam, recarregados */
    r.coracoes.forEach((c, i) => ctx.anim(c, [{ transform: 'scale(1)' }, { transform: 'scale(1.4)' }, { transform: 'scale(1)' }], { duration: 260, delay: 60 + i * 70, fill: 'none', easing: 'ease-out' }));
    /* o prêmio falha de novo; o herói se vira para olhar */
    ctx.em(tF1, () => { s.falha(); r.premio.falhar(ctx, 400, 'inteiro'); });
    ctx.em(tF1 + 330, () => { heroiEm(TOPO.x, TY, true).alerta(true); salto(ctx, TOPO.x, 9, 200, true); });
    ctx.em(tF2, () => { s.falha({ ganho: 0.36 }); r.premio.falhar(ctx, 640, 'falha'); });
    /* e se desfaz em pedaços: era falso */
    ctx.em(tD, () => desfazerPremio(ctx));
    ctx.em(tD + 560, () => r.h.alerta(false));
    /* a noite cai sobre o templo, com uma nota grave; o título entra */
    ctx.em(tN, () => {
      tp.mudarHora(ctx, 'noite', NOITE);
      s.tambor({ freq: 38, ganho: 0.8, dur: 1.6 }); s.chip({ tipo: 'triangle', freq: 82, ate: 55, dur: 1.7, ganho: 0.16 });
      s.ambiente({ vento: 0.25 }, 2.4);
    });
    r.cab.entrar(ctx, tN + 500);
    ctx.em(tN + NOITE + 300, ctx.concluir);
  }

  /* ---------- passos 1 a 6: os quatro baús ---------- */
  /* some o que ficou do baú anterior: o cartão sai e vira a marca com o nome; o baú aberto cai; a fala se apaga */
  function recolher(ctx, i) {
    const s = ctx.som, m = r.marcas[i], rot = MARCA.rot[i];
    r.cartoes[i].sair(ctx); r.baloes[i].sair(ctx, 60);
    ctx.anim(r.baus[i].el, [{ opacity: 1, transform: 'translateY(0px)' }, { opacity: 0, transform: 'translateY(50px)' }], { duration: 300, easing: 'ease-in' });
    /* a marca sai do cabeçalho do cartão e voa baixo até a lista: por baixo do título, por cima da escada
       (o cravar() da lasca faz um arco alto, que aqui passaria por cima do título) */
    const cx = MARCA.x + 22, cy = MARCA.y[i] + 24, de = { x: CARTAO.x + 40, y: CARTAO.y + 40 }, meio = { x: 560, y: 212 };
    ctx.anim(m.el, [
      { opacity: 0, transform: `translate(${de.x - cx}px,${de.y - cy}px) rotate(-6deg) scale(.5)` },
      { opacity: 1, transform: `translate(${de.x - cx - 30}px,${de.y - cy - 6}px) rotate(-6deg) scale(.6)`, offset: 0.1, easing: 'cubic-bezier(.4,0,.6,1)' },
      { opacity: 1, transform: `translate(${meio.x - cx}px,${meio.y - cy}px) rotate(-9deg) scale(.72)`, offset: 0.5, easing: 'cubic-bezier(.3,.3,.4,1)' },
      { opacity: 1, transform: `translate(-6px,3px) rotate(${rot - 3}deg) scale(1.1)`, offset: 0.9 },
      { opacity: 1, transform: `translate(0px,0px) rotate(${rot}deg) scale(1)` }], { duration: 640, delay: 120 });
    ctx.em(120 + 600, () => s.clac({ tom: 0.8, ganho: 0.45 }));
  }
  const pop = [{ opacity: 0, transform: 'scale(.2) rotate(-40deg)' }, { opacity: 1, transform: 'scale(1.15) rotate(6deg)', offset: 0.7 }, { opacity: 1, transform: 'scale(1) rotate(0deg)' }];
  const naBase = b => { b.el.style.transformBox = 'fill-box'; b.el.style.transformOrigin = '50% 100%'; };
  /* quatro jeitos de o presente chegar. Cada um devolve o instante (ms) em que o baú está na luz e a fala no balão */
  const ENTREGAS = {
    /* baú 1: a faísca acende o feixe e o baú aparece nele */
    feixe(ctx, i) {
      const s = ctx.som, b = r.baus[i];
      M.voar(ctx, r.ia, [lado(RECUO[i]), ENTREGA], 320, { aoFim: 'entregando', fim: () => s.presente() });
      ctx.anim(r.luz, surge, { duration: 300, delay: 360, fill: 'none' }); ctx.em(650, () => op(r.luz, 1));   // sem fill: a luz precisa ficar livre para pulsar depois
      ctx.anim(b.el, [{ opacity: 0, transform: 'translateY(-30px)' }, { opacity: 1, transform: 'translateY(5px)', offset: 0.7 }, { opacity: 1, transform: 'translateY(0px)' }], { duration: 460, delay: 360, easing: 'ease-out' });
      M.voar(ctx, r.ia, [ENTREGA, FALA], 320, { atraso: 1050 });
      r.baloes[i].entrar(ctx, 1400);
      return 1680;
    },
    /* baú 2: num rasante, sem cerimônia: "já calculei" */
    rasante(ctx, i) {
      const s = ctx.som, b = r.baus[i];
      M.voar(ctx, r.ia, [FALA, { x: 930, y: 150 }, { x: 800, y: 118 }, ENTREGA], 460, { atraso: 120, estado: 'disparando', aoFim: 'entregando', fim: () => s.presente() });
      naBase(b); ctx.anim(b.el, pop, { duration: 300, delay: 560, easing: 'ease-out' });
      M.voar(ctx, r.ia, [ENTREGA, FALA], 240, { atraso: 900 });
      r.baloes[i].entrar(ctx, 1120);
      return 1400;
    },
    /* baú 3: devagar, descendo pelo feixe até a mão dele: "você tem razão" */
    desce(ctx, i) {

      M.voar(ctx, r.ia, [ENTREGA, FALA], 300, { atraso: 1450 });

    },
    /* baú 4: três baús piscam e somem antes de ficar o que "deu" */
    sorteia(ctx, i) {
      const s = ctx.som, b = r.baus[i], T = 330, D = 150;

      [[-30, -62], [44, -86], [66, -28]].forEach(([dx, dy], k) => {
        ctx.em(T + k * D, () => { r.fantasma.por(BAU.x + dx, BAU.y + dy); s.bipe({ freq: 700 + k * 120, dur: 0.05, ganho: 0.09 }); });

  /* os recortes que "não deram": saem de dentro do baú 4 quando ele abre */
  function recortes(ctx) {
    const rnd = rng(404), x0 = BAU.x, y0 = BAU.y - 44;
    for (let k = 0; k < 10; k++) {
      const g = svg('g', {});
      g.innerHTML = '<rect x="-14" y="-15" width="28" height="15" rx="2" fill="#C9C9EE" stroke="#00010F" stroke-width="1.4"/><path d="M-15,-15 Q-15,-26 0,-26 Q15,-26 15,-15 Z" fill="#A9AADC" stroke="#00010F" stroke-width="1.4"/><rect x="-3.5" y="-25.5" width="7" height="25.5" fill="#00A1B8" stroke="#00010F" stroke-width="1"/>';
      r.tp.fx.appendChild(g); ctx.temp(g);
      const dx = 10 + rnd() * 190, sobe = 40 + rnd() * 70, cai = 150 + rnd() * 130, gira = (rnd() - 0.5) * 520;   // para a direita e para baixo: longe do título
      const a = ctx.anim(g, [{ opacity: 0, transform: `translate(${x0}px,${y0}px) rotate(0deg) scale(.5)` },
        { opacity: 0.8, transform: `translate(${x0}px,${y0}px) rotate(0deg) scale(.5)`, offset: 0.04, easing: 'cubic-bezier(.2,.6,.5,1)' },
        { opacity: 0.8, transform: `translate(${n1(x0 + dx * 0.5)}px,${n1(y0 - sobe)}px) rotate(${n1(gira * 0.4)}deg) scale(1)`, offset: 0.36, easing: 'cubic-bezier(.5,0,.9,.5)' },
        { opacity: 0, transform: `translate(${n1(x0 + dx)}px,${n1(y0 + cai)}px) rotate(${n1(gira)}deg) scale(1)` }], { duration: 950 + rnd() * 450, delay: k * 50 });

  /* quatro jeitos de levar o golpe: de ABRE até `para`. Cada um termina com o herói em pé, piscando */
  const levanta = (ctx, para, ms) => { r.h.por(para, TY).estado('agachado'); M.levantar(ctx, r.h, 120, ms); r.h.piscar(ctx, 760, 160); };
  const REACOES = {
    empurra(ctx, para) {                                                  // um tranco para trás
      ctx.tween(400, e => heroiEm(ABRE + (para - ABRE) * e, TY - 4 * 18 * e * (1 - e), false).pose('atingido', { giro: -12 * (1 - e) }), { curva: E.outQuad, fim: () => levanta(ctx, para, 300) });
    },
    rola(ctx, para) {                                                     // rola de costas
      M.rolar(ctx, r.h, [{ x: ABRE, y: TY }, { x: para, y: TY }], 540, { voltas: 1, quique: 9, saltos: 2, curva: E.outQuad, fim: () => levanta(ctx, para, 320) });
    },
    voa(ctx, para) {                                                      // arremessado pelo ar, cai de costas e demora a levantar
      const s = ctx.som;
      ctx.tween(640, e => heroiEm(ABRE + (para - ABRE) * e, TY - 4 * 40 * e * (1 - e), false).pose('atingido', { giro: -360 * e }), { fim: () => {
        r.h.por(para, TY).pose('caido'); s.passo({ ganho: 0.6 }); r.tp.tremor(ctx, 4, 150); r.tp.poeira(ctx, para, TY, 6, 0.9);
        ctx.tween(340, e => r.h.mistura('caido', 'agachado', e), { atraso: 420, curva: E.inOut, fim: () => { M.levantar(ctx, r.h, 0, 380); r.h.piscar(ctx, 700, 0); } });

        tp.poeira(ctx, para - 26, TY, 8, 1.1); tp.estilhacos(ctx, para - 34, TY + 6, 5, 0.5); s.passo({ ganho: 0.5 });

  function entregar(ctx, i) {

    const t0 = K.cartao + C.entrar(ctx, K.cartao);
    ctx.em(K.cartao + 430, () => s.clac({ tom: 0.9, ganho: 0.3 }));
    C.revelar(ctx, 0, t0 + 420);
    if (temNumero) C.revelar(ctx, 'rodape', t0 + 1320);
    return t0 + (temNumero ? 2500 : 1900);
  }
  /* passos 1 e 4 (baús 1 e 3): só a entrega. O baú fica fechado na luz, flutuando, com a fala da IA, e o herói com a mão
     estendida. O passo termina aí e espera a tecla: a pausa da pergunta "abre ou não abre?" é do apresentador */
  function tocarEntrega(i) {

  function casasAcesas(n) {

  /* ---------- estado final de cada passo ----------
     aplicar(p) põe o estado INTEIRO do fim do passo p, na hora e sem som. É o fim() de todos os passos:

    r.fDecide.definir(p === 3); r.fSalvo.definir(p === 4); r.fVolta.definir(p === 5); r.fArmadilha.definir(p === 7); r.fFecho.definir(p === 11);

  const FIM = Array.from({ length: PASSOS }, (_, p) => () => aplicar(p));

  /* ================= Parte 4: tocar(ctx), a versão animada de cada passo ================= */
  const some = [{ opacity: 1 }, { opacity: 0 }], surge = [{ opacity: 0 }, { opacity: 1 }];
  const sobe = [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'translateY(0px)' }];

  const pulso = (ctx, el, k, ms) => ctx.anim(el, [{ transform: 'scale(1)' }, { transform: `scale(${k || 1.2})` }, { transform: 'scale(1)' }], { duration: ms || 320, fill: 'none', easing: 'ease-out' });
  const pulsoVidas = ctx => pulso(ctx, r.hud.el.querySelector('.jg-cor'), 1.16, 420);          // nenhuma vida se perde nesta cena: os corações só pulsam

  /* herói e faísca andando pelo mapa. pts em coordenadas do mapa; a posição na tela segue a câmera.
     o = { atraso, passada, rapido, marcas: [{ x, fn }] }: cada marca dispara quando os pés passam de x */
  function andarMapa(ctx, pts, ms, o) {
    o = o || {}; const c = M.caminho(pts), atraso = o.atraso || 0, n = Math.max(2, Math.min(Math.round(c.L / (o.passada || 15)), Math.round(ms / 110)));
    const marcas = (o.marcas || []).map(m => Object.assign({ feito: false }, m));

  }
  /* o herói grande, dentro da etapa: passada proporcional ao tamanho dele */
  function caminhar(ctx, h, de, ate, ms, atraso) {

  /* o herói passa por um portão: a grade some e a bandeira balança */

  /* toque de checkpoint: a bandeira cresce, um anel de luz se abre e duas notas sobem */

  /* ---------- 0 · o mapa se desenrola ---------- */

  /* ---------- 1 · o caminho se acende, região por região; cada ponto mostra o nome enquanto a região está em foco ---------- */
  function acenderUm(ctx, i) {

  /* ---------- 2 · zoom na etapa: a faísca percorre P, E e V e para diante do portão fechado. Fica esperando a tecla ---------- */

  /* ---------- 4 · zoom de volta; sobem as 13 bandeiras; nas 5 críticas, a segunda pessoa ---------- */
  function subirBandeira(ctx, i) {

  /* ---------- 5 · a pedra do mundo 1 cai de novo, na etapa 03: o herói volta só até a bandeira anterior ---------- */
  function tocar5(ctx) {

    const tE = 150 + SOBE - 500, tL = tE + r.pedra.chegar(ctx, 'cai', tE), tG = tL + 1900, tI = tG + G.ms;
    ctx.em(150 + SOBE + 80, () => r.h.alerta(true));
    let bob = null; ctx.em(tL, () => { bob = r.pedra.flutuar(ctx); });
    ctx.em(tG, () => { if (bob) bob.cancel(); r.pedra.golpear(ctx, G); });
    ctx.em(tI, () => {

      c.poeira(ctx, alvo.x, alvo.y - 10, 9, 1.2); c.estilhacos(ctx, alvo.x + 14, alvo.y - 46, 9);
