/* ============ MOTOR ============ */
:root{
  --w:1280px;--h:720px;
  /* identidade ESEG (PERFIL-ESEG.md 2.1): o jogo é azul e branco */
  --marinho:#000653;--lav-1:#ECEDFF;--lav-2:#E3E2FD;--acento:#00A1B8;
  /* derivados do marinho e das lavandas: noite, pedra, mata */
  --n-900:#00010F;--n-800:#020430;--n-700:#070B4A;--n-600:#0C1060;--n-500:#151A6E;
  --n-400:#2A2F7C;--n-300:#3A3F8C;--n-200:#565A94;--l-500:#7477B6;--l-400:#8E90C8;--l-300:#A9AADC;--l-200:#C1C1E3;
  --font:"Public Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--n-900);overflow:hidden}
body{font-family:var(--font);color:var(--lav-1);-webkit-font-smoothing:antialiased;font-kerning:normal}
#vp{position:fixed;inset:0;overflow:hidden;cursor:default}
#quadro{position:absolute;left:0;top:0;width:var(--w);height:var(--h);transform-origin:0 0}
.palco{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:var(--n-900);font-family:var(--font);color:var(--lav-1);user-select:none}
.palco.cortina{position:absolute;left:0;top:0;z-index:30;pointer-events:none}
#ind{position:absolute;left:14px;bottom:8px;z-index:60;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--lav-2);opacity:.55;font-variant-numeric:tabular-nums;pointer-events:none}
#ind .mudo{margin-left:8px;padding:1px 7px;border:1px solid currentColor;border-radius:999px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#notas{position:fixed;right:0;top:0;bottom:0;width:min(460px,42vw);z-index:80;overflow:auto;padding:22px 24px 28px;background:rgba(0,3,37,.96);border-left:1px solid var(--n-300);color:var(--lav-1);font-size:16px;line-height:1.5;display:none}
#notas.aberto{display:block}
#notas h2{margin:0 0 4px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--l-300)}
#notas h3{margin:18px 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--l-300)}
#notas .tit{font-size:20px;font-weight:750;margin:0 0 6px}
#notas p{margin:0 0 10px}
#notas ul{margin:0;padding-left:18px}
#notas li{margin-bottom:6px}
#notas .teclas{margin-top:20px;padding-top:12px;border-top:1px solid var(--n-300);font-size:13px;color:var(--l-300)}
#imp{display:none}
html.parado *,html.parado *::before,html.parado *::after{animation:none!important;transition:none!important}
@page{size:1280px 720px;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .no-print{display:none!important}
  #vp{position:static;overflow:visible}
  #quadro{position:static;transform:none!important}
  html.imprimindo #vp{display:none}
  html.imprimindo #imp{display:block}
  .pagina{break-after:page;page-break-after:always;break-inside:avoid}
  .pagina:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ============ CAMADA DE JOGO (motor): HUD, telas, peças, oficina ============ */
.jg-hud{position:absolute;left:40px;right:40px;top:14px;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-radius:12px;
  background:rgba(0,1,15,.66);box-shadow:inset 0 0 0 2px rgba(227,226,253,.4),0 6px 18px rgba(0,1,15,.4);font-weight:800;color:#fff;white-space:nowrap;pointer-events:none}
.jg-g{display:flex;align-items:center}
.jg-r{font-size:20px;line-height:1;letter-spacing:.14em;text-transform:uppercase;color:var(--l-200);margin-right:13px}
.jg-cor{display:inline-flex;gap:7px}
.jg-cor svg{display:block;width:30px;height:28px;overflow:visible}
.jg-cor .ch{fill:#fff;stroke:#fff;stroke-width:1.6;stroke-linejoin:round}
.jg-cor .tr{fill:none;stroke:var(--l-300);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.jg-cor .vazio .ch{fill:none;stroke:var(--l-300);stroke-width:2.2}
.jg-cor .vazio .tr{opacity:1}
.jg-fase b{font-size:25px;line-height:1;font-weight:820;font-variant-numeric:tabular-nums;display:inline-block}
.jg-nome{font-size:21px;line-height:1;font-weight:660;margin-left:13px;color:var(--lav-1)}
.jg-barra{position:relative;display:block;width:210px;height:18px;border-radius:10px;box-shadow:inset 0 0 0 2px var(--l-200);overflow:hidden}
.jg-barra i{position:absolute;left:4px;top:4px;bottom:4px;width:calc((100% - 8px) * var(--p,1));background:#fff;border-radius:6px}
.jg-prazo.baixo .jg-barra i{animation:jg-pisca .46s steps(2,jump-none) infinite}
@keyframes jg-pisca{from{opacity:1}to{opacity:.25}}
/* campo "2 jogadores: Analista · IA": aba pendurada sob o HUD, à direita */
.jg-jog{position:absolute;right:18px;top:44px;height:40px;display:flex;align-items:center;padding:2px 18px 0;border-radius:0 0 12px 12px;background:rgba(0,1,15,.66);box-shadow:inset 0 0 0 2px rgba(227,226,253,.4);font-size:21px;line-height:1;font-weight:760;color:#fff}
.jg-jog .jg-r{letter-spacing:.1em}
.jg-jog i{font-style:normal;margin:0 9px;color:var(--l-300)}
.jg-jog .ia{color:var(--acento)}

/* tela de título */
.jg-titulo{position:absolute;color:#fff}
.jg-t-mundo{font-size:24px;line-height:30px;font-weight:780;letter-spacing:.17em;text-transform:uppercase;color:var(--l-200)}
.jg-t-nome{margin:10px 0 0;font-size:80px;line-height:.98;font-weight:860;letter-spacing:-.028em;color:#fff;text-shadow:0 5px 0 var(--n-400),0 14px 30px rgba(0,1,15,.6)}
.jg-t-dica{margin-top:38px;font-size:27px;line-height:34px;font-weight:760;letter-spacing:.06em;color:var(--lav-1)}
.jg-t-dica i{font-style:normal;animation:jg-pisca 1.05s steps(2,jump-none) infinite}
/* GAME OVER e Continuar? */
.jg-go{position:absolute;white-space:nowrap;font-size:88px;line-height:1;font-weight:880;letter-spacing:.05em;color:#fff;text-shadow:0 6px 0 var(--n-300),0 0 0 #000,0 16px 34px rgba(0,1,15,.7);-webkit-text-stroke:2px var(--n-900);paint-order:stroke fill}
.jg-cont{position:absolute;display:flex;align-items:center;white-space:nowrap;font-size:36px;line-height:1;font-weight:840;color:#fff}
.jg-cont-b{display:inline-flex;gap:7px;margin-left:18px}
.jg-cont-b i{width:22px;height:12px;border-radius:3px;background:#fff}
.jg-cont-b i.gasto{background:none;box-shadow:inset 0 0 0 2px var(--l-300)}
.jg-cont.espera>span:first-child{animation:jg-pisca .9s steps(2,jump-none) infinite}
.jg-logo{position:absolute;right:26px;bottom:14px;width:60px;height:auto;opacity:.82;filter:brightness(0) invert(1)}

/* efeitos */
.jg-po{transform-box:fill-box;transform-origin:50% 50%}
/* pedra com motivo (lida antes do impacto) e lasca (o motivo que fica à vista) */
.jg-pedra{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;line-height:1.13;font-weight:830;letter-spacing:-.005em;color:var(--marinho);filter:drop-shadow(0 12px 12px rgba(0,1,15,.6));transform-origin:50% 50%}
.jg-pedra>svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.jg-pedra span{position:relative}
.jg-lasca{position:absolute;transform-origin:8% 50%;filter:drop-shadow(0 6px 9px rgba(0,1,15,.6))}
.jg-lasca div{padding:9px 17px 10px;font-size:21px;line-height:26px;font-weight:680;white-space:nowrap;color:var(--marinho);background:linear-gradient(172deg,#F3F3FF 0%,#E3E2FD 45%,#C9C9EE 100%);
  clip-path:polygon(0 7px,8px 0,calc(100% - 11px) 0,100% 9px,100% calc(100% - 6px),calc(100% - 9px) 100%,10px 100%,0 calc(100% - 10px))}
/* cartão de texto */
.jg-cartao{position:absolute;padding:20px 26px 22px;background:linear-gradient(176deg,#F6F6FF,#E3E2FD);color:var(--marinho);border-radius:5px;box-shadow:0 22px 46px rgba(0,1,15,.7),inset 0 0 0 1px rgba(0,6,83,.2);transform-origin:50% 0}
.jg-ct-cab{font-size:20px;line-height:24px;font-weight:840;letter-spacing:.14em;text-transform:uppercase;padding-bottom:11px;border-bottom:3px solid var(--marinho)}
.jg-ct-l{display:flex;align-items:flex-start;margin-top:12px;font-size:23px;line-height:29px;font-weight:650}
.jg-ct-l b{flex:none;width:36px;font-weight:860}
.jg-ct-l span{text-wrap:balance}
.jg-ct-l.destaque{margin:13px -12px 0;padding:9px 12px 10px;border-radius:5px;background:var(--marinho);color:var(--acento);font-weight:800;box-shadow:inset 6px 0 0 var(--acento);padding-left:22px}
.jg-ct-rod{margin-top:14px;padding-top:10px;border-top:1.5px solid rgba(0,6,83,.28);font-size:20px;line-height:25px;font-weight:580;color:var(--n-400)}
/* aposta: pergunta e três opções */
.jg-aposta{position:absolute;padding:22px 26px 24px;border-radius:14px;background:rgba(0,1,15,.86);box-shadow:inset 0 0 0 2px rgba(227,226,253,.4),0 18px 40px rgba(0,1,15,.6);color:#fff}
.jg-ap-q{font-size:30px;line-height:1.2;font-weight:780;text-wrap:balance}
.jg-ap-o{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
.jg-ap-o span{display:flex;align-items:center;justify-content:center;height:86px;border-radius:12px;box-shadow:inset 0 0 0 3px var(--l-200);font-size:42px;line-height:1;font-weight:860;font-variant-numeric:tabular-nums;white-space:nowrap}
.jg-ap-o span.certa{background:#fff;color:var(--marinho);box-shadow:none;transform:scale(1.06)}
.jg-ap-o span.errada{opacity:.3}
/* cabeçalho da cena, frase de pé de tela, balão de fala */
.jg-cab{position:absolute;left:56px;top:72px;text-shadow:0 2px 12px rgba(0,1,15,.75),0 0 2px rgba(0,1,15,.6)}
.jg-cab-e{display:block;font-size:20px;line-height:24px;font-weight:750;letter-spacing:.17em;text-transform:uppercase;color:var(--l-200)}
.jg-cab-t{margin:3px 0 0!important;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-.018em;color:#fff;white-space:nowrap}
.jg-frase{position:absolute;left:0;width:1280px;margin:0;text-align:center;white-space:nowrap;font-size:33px;line-height:42px;font-weight:720;color:#fff;text-shadow:0 2px 12px rgba(0,1,15,.75),0 0 2px rgba(0,1,15,.6)}
.jg-frase.acento{font-size:45px;line-height:54px;font-weight:840;letter-spacing:-.012em;color:var(--acento)}
.jg-balao{position:absolute;width:0;height:0;transform-origin:0 0}
.jg-balao>div{position:absolute;left:0;bottom:0;padding:11px 20px 12px;border-radius:16px 16px 16px 4px;background:rgba(0,1,15,.9);box-shadow:inset 0 0 0 3px var(--l-200),0 8px 20px rgba(0,1,15,.5);color:#fff;font-size:26px;line-height:1.15;font-weight:780;white-space:nowrap}
.jg-balao.ia>div{box-shadow:inset 0 0 0 3px var(--acento),0 8px 20px rgba(0,1,15,.5)}
/* palco em camadas para cena sem templo */
.jg-cena{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#000653,#0B0F66 55%,#23277F)}
.jg-mundo{position:absolute;inset:0}
.jg-mundo>svg{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
.jg-z{position:absolute;inset:0}
.jg-hudc{pointer-events:none}
.jg-hudc p,.jg-hudc h1{margin:0}
/* aliado: flutua parado (some no modo parado=1) */
.jg-al-flutua{animation:jg-al-flutua 1.5s ease-in-out infinite alternate}
@keyframes jg-al-flutua{from{transform:translateY(-4px)}to{transform:translateY(4px)}}

/* oficina (?oficina=1 e 2, ?heroi=1): folhas para julgar o desenho dos componentes */
.jg-oficina{position:absolute;inset:0;background:linear-gradient(180deg,#000653,#0B0F66 55%,#23277F)}
.jg-oficina>svg{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
.jg-oficina h1,.jg-of-h{position:absolute;left:40px;top:22px;margin:0;font-size:26px;font-weight:800;color:#fff}
.jg-of-r{position:absolute;width:300px;margin-left:-150px;text-align:center;font-size:20px;line-height:24px;font-weight:700;color:var(--lav-1);white-space:nowrap}
.jg-of-t{position:absolute;font-size:20px;line-height:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--l-300);white-space:nowrap}

/* ============ CAMADA DE JOGO · templo e cenário em camadas (mundos 1, 2 e 3) ============ */
.tp{position:absolute;inset:0;overflow:hidden;background:var(--n-900)}
.tp-mundo{position:absolute;inset:0}
.tp-pl{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:640px 380px}
.tp-vai{position:absolute;inset:0;animation:tp-vai 17s ease-in-out infinite alternate}
@keyframes tp-vai{from{transform:translateX(calc(var(--prof,0)*-7px))}to{transform:translateX(calc(var(--prof,0)*7px))}}
.tp-pl>svg,.tp-vai>svg{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
.tp-z{position:absolute;inset:0}
.tp-ceu{position:absolute;inset:-60px;background:linear-gradient(180deg,#000653 0%,#0B0F66 22%,#23277F 42%,#4B4FA0 60%,#8E90D0 76%,#C9C8F4 90%)}
.tp-halo{position:absolute;left:390px;top:260px;width:800px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(236,237,255,.55),rgba(227,226,253,.18) 55%,rgba(227,226,253,0) 100%)}
.tp-disco{position:absolute;left:748px;top:163px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#fff,#ECEDFF 62%,#D9D8FA);box-shadow:0 0 0 14px rgba(236,237,255,.10),0 0 70px 26px rgba(227,226,253,.32)}
.tp-veu{position:absolute;inset:-80px;background:var(--n-900);pointer-events:none}
.tp-noite-fundo{position:absolute;inset:-80px;background:var(--n-900);pointer-events:none}
.tp-est{position:absolute;inset:0}
.tp-est circle{fill:#ECEDFF}
.tp-pisca{animation:tp-pisca 3.4s ease-in-out infinite}
@keyframes tp-pisca{0%,100%{opacity:1}50%{opacity:.25}}
.tp-tarefa{transform-box:fill-box;transform-origin:50% 100%}
.tp-fase{position:absolute;display:flex;align-items:center;justify-content:center;height:54px;font-size:22px;line-height:1;font-weight:720;letter-spacing:.012em;color:var(--lav-1);white-space:nowrap;text-shadow:0 -1px 0 rgba(0,1,15,.75),0 1px 0 rgba(169,170,220,.28);padding-top:3px}
.tp-hud{position:absolute;inset:0;pointer-events:none}
.tp-hud p,.tp-hud h1{margin:0}

/* ============ CENA 01 · Mundo 1 — Incas e maias: o CRISP-DM ============
   Só o que é desta cena. Templo e cenário: jogo-templo.css. HUD, pedra, lasca, cartão: jogo.css. */
.c1-grito{position:absolute;width:420px;margin-left:-210px;text-align:center;white-space:nowrap;font-size:31px;line-height:1;font-weight:880;letter-spacing:.02em;color:#fff;-webkit-text-stroke:6px var(--marinho);paint-order:stroke fill;text-shadow:0 5px 10px rgba(0,1,15,.7)}
.c1-sombra{text-shadow:0 2px 12px rgba(0,1,15,.75),0 0 2px rgba(0,1,15,.6)}
.c1-cab{position:absolute;left:56px;top:72px}
.c1-eyebrow{display:block;font-size:20px;line-height:24px;font-weight:750;letter-spacing:.17em;text-transform:uppercase;color:var(--l-200)}
.c1-titulo{margin-top:3px!important;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-.018em;color:#fff;white-space:nowrap}
.c1-museu{position:absolute;right:40px;top:74px;padding:9px 18px 10px;background:var(--lav-1);color:var(--marinho);font-size:20px;line-height:26px;font-weight:560;white-space:nowrap;border-radius:3px;box-shadow:0 8px 20px rgba(0,1,15,.5),inset 0 0 0 1px rgba(0,6,83,.18);transform-origin:50% -30px}
.c1-museu b{display:block;font-weight:820;letter-spacing:.01em}
.c1-cont{position:absolute;display:flex;flex-direction:column;align-items:flex-start}
.c1-cont b{display:block;font-size:84px;line-height:.94;font-weight:820;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums;transform-origin:0 80%}
.c1-cont span{font-size:26px;line-height:32px;font-weight:660;color:var(--lav-2);white-space:nowrap}
.c1-cont-t{left:56px;top:188px}
.c1-cont-s{left:896px;top:346px}
.c1-leg{position:absolute;left:0;width:1280px;text-align:center;white-space:nowrap}
.c1-leg-volta{top:636px;font-size:33px;line-height:42px;font-weight:720;color:#fff}
.c1-fimq{top:642px;font-size:45px;line-height:54px;font-weight:840;letter-spacing:-.012em;color:var(--acento)}

/* tela de título: o herói sobre uma laje e o nome do jogo */
.c1-abre{position:absolute;inset:0}
.c1-abre>svg{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
.c1-abre .jg-titulo{left:480px;top:176px;width:770px}
.c1-abre .jg-t-nome{font-size:76px}
.c1-abre.entra{animation:c1-entra .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes c1-entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* fim de jogo */
.c1-go{position:absolute;left:0;width:1200px;top:176px;text-align:center}
.c1-go .jg-go{position:static;display:inline-block;font-size:78px}
.c1-continuar{left:252px;top:486px;padding:9px 18px 10px;border-radius:10px;background:rgba(0,1,15,.78);font-size:34px}
.c1-p2{position:absolute;left:252px;top:546px;display:flex;align-items:center;gap:12px;padding:11px 20px 12px 16px;border-radius:10px;background:rgba(0,1,15,.82);box-shadow:inset 0 0 0 3px var(--acento),0 10px 24px rgba(0,1,15,.6);color:var(--acento);font-size:30px;line-height:1;font-weight:850;white-space:nowrap}
.c1-p2 i{width:18px;height:18px;background:var(--acento);transform:rotate(45deg);border-radius:3px}

/* ============ CENA 02 · Mundo 2 — O aliado: a IA entra no jogo ============
   Só o que é desta cena. Templo e cenário: jogo-templo.css. HUD, pedra, lasca, cartão, aposta, frase: jogo.css.
   Nenhum ciano aqui fora do quadro de partida (que é do mundo 1): nesta cena o ciano é a faísca e o que ela toca, em SVG. */

/* quadro de partida: a tela "Continuar?" do mundo 1, redesenhada. Mesmas medidas da cena 01; some no passo 0 */
.c02-q01{position:absolute;inset:0}
.c02-q01-museu{position:absolute;right:40px;top:74px;padding:9px 18px 10px;background:var(--lav-1);color:var(--marinho);font-size:20px;line-height:26px;font-weight:560;white-space:nowrap;border-radius:3px;box-shadow:0 8px 20px rgba(0,1,15,.5),inset 0 0 0 1px rgba(0,6,83,.18);transform-origin:50% -30px}
.c02-q01-museu b{display:block;font-weight:820;letter-spacing:.01em}
.c02-q01-cont{left:252px;top:486px;padding:9px 18px 10px;border-radius:10px;background:rgba(0,1,15,.78);font-size:34px}
.c02-q01-p2{position:absolute;left:252px;top:546px;display:flex;align-items:center;gap:12px;padding:11px 20px 12px 16px;border-radius:10px;background:rgba(0,1,15,.82);box-shadow:inset 0 0 0 3px var(--acento),0 10px 24px rgba(0,1,15,.6);color:var(--acento);font-size:30px;line-height:1;font-weight:850;white-space:nowrap}
.c02-q01-p2 i{width:18px;height:18px;background:var(--acento);transform:rotate(45deg);border-radius:3px}

/* aposta à espera da turma: as três opções pulsam em sequência (parado=1 desliga) */
.c02-espera .jg-ap-o span{animation:c02-espera 1.6s ease-in-out infinite}
.c02-espera .jg-ap-o span:nth-child(2){animation-delay:.22s}
.c02-espera .jg-ap-o span:nth-child(3){animation-delay:.44s}
@keyframes c02-espera{0%,55%,100%{transform:scale(1)}26%{transform:scale(1.06)}}

/* cartão dos três números: três colunas dentro da moldura do cartão */
.c02-tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));color:var(--marinho)}
.c02-num{display:flex;flex-direction:column;align-items:center;text-align:center;white-space:nowrap;padding:0 4px}
.c02-num+.c02-num{box-shadow:-2px 0 0 rgba(0,6,83,.16)}
.c02-num i{display:block;height:26px;font-style:normal;font-size:22px;line-height:26px;font-weight:720;color:var(--n-400)}
.c02-num b{display:block;font-size:58px;line-height:62px;font-weight:860;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.c02-num span{display:block;margin-top:2px;font-size:23px;line-height:28px;font-weight:720}

/* cartão dos estudos: o número de cada linha em corpo grande */
.c02-est-l{display:flex;align-items:baseline;margin-top:10px;color:var(--marinho);white-space:nowrap}
.c02-est-l b{flex:none;width:70px;padding-right:14px;text-align:right;font-size:44px;line-height:46px;font-weight:860;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.c02-est-l span{font-size:23px;line-height:29px;font-weight:680}

/* a linha escrita nas tabuletas: cresce da esquerda para a direita */
.c02-risco{transform-box:fill-box;transform-origin:0 50%}

/* topo: "Fase concluída" à direita do templo, o rótulo do prêmio à esquerda dele, a pergunta no pé da tela */
.c02-fc{position:absolute;left:790px;top:126px;width:450px;text-align:center;transform-origin:100% 45%}
.c02-fc .jg-go{position:static;display:inline-block;font-size:70px;line-height:1.02}
.c02-rotulo{position:absolute;right:790px;top:196px;padding:7px 16px 8px;border-radius:9px;background:rgba(0,1,15,.82);box-shadow:inset 0 0 0 2px var(--l-200);font-size:24px;line-height:28px;font-weight:800;letter-spacing:.04em;color:#fff;white-space:nowrap;transform-origin:100% 50%}
.c02-rotulo::after{content:"";position:absolute;left:100%;top:50%;margin-top:-7px;border:7px solid transparent;border-left:10px solid var(--l-200);border-right:0}
.c02-pergunta{font-size:45px;line-height:54px;font-weight:840;letter-spacing:-.012em}
/* o prêmio brilhando: halo que pulsa, raios que giram, cintilações (parado=1 desliga o movimento; o desenho fica) */
.c02-halo,.c02-raios,.c02-cintila{transform-box:fill-box;transform-origin:50% 50%}
.c02-halo{animation:c02-pulsa 1.7s ease-in-out infinite alternate}
.c02-raios{animation:c02-gira 16s linear infinite}
.c02-cintila{animation:c02-cintila 1.3s ease-in-out infinite alternate}
@keyframes c02-pulsa{from{transform:scale(.86);opacity:.65}to{transform:scale(1.14);opacity:1}}
@keyframes c02-gira{to{transform:rotate(360deg)}}
@keyframes c02-cintila{from{transform:scale(.2);opacity:.2}to{transform:scale(1);opacity:1}}

/* ============ CENA 03 · Mundo 3 — O trapaceiro: a IA erra com convicção ============
   Só o que é desta cena. Templo: jogo-templo.css. HUD, baú, balão, cartão, lasca, frase: jogo.css.
   Nada abaixo de 20 px. O ciano fica com a faísca, a fala dela e a frase sobre a IA. */

/* cartão de armadilha: o nome é o que a turma leva, então vai grande e em caixa normal; o número vira a linha forte do rodapé */
.c03-arm .jg-ct-cab{padding-bottom:9px;font-size:29px;line-height:34px;font-weight:850;letter-spacing:-.012em;text-transform:none}
.c03-arm .jg-ct-rod b{display:block;margin-bottom:3px;font-size:32px;line-height:36px;font-weight:860;letter-spacing:-.012em;color:var(--marinho);font-variant-numeric:tabular-nums}
.c03-arm .jg-ct-rod i{font-style:italic}
/* marca com o nome da armadilha: a lasca da cena 01, maior, porque os quatro nomes ficam até o fim */
.c03-marca div{padding:9px 19px 10px;font-size:25px;line-height:30px;font-weight:760}
/* cartão da fronteira: sem cabeçalho, a primeira linha encosta no topo */
.c03-front .jg-ct-l:first-child{margin-top:0}
/* a frase que fecha a cena, do tamanho da frase de acento, em branco: é para o analista, não é da IA */
.c03-fecho{font-size:45px;line-height:54px;font-weight:840;letter-spacing:-.012em}
/* à espera da tecla (passos 1 e 4): o baú fechado flutua, a luz da faísca pulsa e os brilhos piscam, para a tela não
   parecer travada enquanto a turma responde. parado=1 e a impressão não animam: mostram o baú parado na luz, sem brilhos */
.c03-flutua{animation:c03-flutua 1.5s ease-in-out infinite alternate}
@keyframes c03-flutua{from{translate:0 0}to{translate:0 -7px}}
.c03-pulsa{animation:c03-pulsa 1.5s ease-in-out infinite alternate}
@keyframes c03-pulsa{from{opacity:1}to{opacity:.45}}
.c03-brilho{transform-box:fill-box;transform-origin:50% 50%}
.c03-on .c03-brilho{animation:c03-brilho 2.2s ease-in-out infinite}
@keyframes c03-brilho{0%,60%,100%{opacity:0;transform:scale(.2) rotate(0deg)}25%{opacity:1;transform:scale(1) rotate(45deg)}}
/* última vida piscando (parado=1 e a impressão mostram o coração cheio) */
.c03-ultima{animation:c03-ultima .9s linear infinite}
@keyframes c03-ultima{0%,46%{opacity:1;transform:scale(1.24)}50%,96%{opacity:.22;transform:scale(1)}100%{opacity:1;transform:scale(1.24)}}
/* efeitos e peças de SVG da cena: giram e crescem em torno de si mesmos */
.c03-fx{transform-box:fill-box;transform-origin:50% 50%}
.c03-linha{transform-box:fill-box;transform-origin:50% 100%}

/* ============ CENA 04 · Mundo 4 — O mapa: herói e aliado jogam juntos ============
   Só o que é desta cena: o mapa, o zoom na etapa, portões, bandeiras e a cópia fantasma.
   HUD, cabeçalho, frases, pedra, baú, cartão, aposta e prêmio: jogo.css. Nada abaixo de 20 px. */
.c04-cam{transform-origin:0 0}
.c04-rotulos{position:absolute;left:0;top:0;width:1280px;height:720px}

/* ---- o mapa: 5 regiões, um caminho, 13 pontos de 4 casas, um portão depois de cada um ---- */
.c04-caixa{fill:#10156A;fill-opacity:.6;stroke:#3A3F8C;stroke-width:2}
.c04-caixa.nomeada{stroke:#7477B6}
.c04-trilho{fill:none;stroke:#2B3082;stroke-width:18}
.c04-ramal{stroke-dasharray:11 9}
.c04-luz path{fill:none;stroke:#7477B6;stroke-width:18}
.c04-meta{fill:#1B2075;stroke:#3A3F8C;stroke-width:2}
.c04-luz .c04-meta{fill:#E3E2FD;stroke:#00010F;stroke-width:1.6}
.c04-chev{fill:none;stroke:#00010F;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.c04-ponto,.c04-trava,.c04-dado,.c04-z-lampada{transform-box:fill-box;transform-origin:50% 50%}
.c04-cel{fill:#1B2075;stroke:#4A4F9C;stroke-width:2}
.c04-ponto.aceso .c04-cel{fill:#C9C9EE;stroke:#00010F;stroke-width:1.6}
/* depois do zoom, cada placa mostra o ciclo: três casas da IA (contorno ciano) e a do humano (branca) */
.c04-mapa.aberto .c04-ponto.aceso .c04-cel.ia{fill:#050C4A;stroke:#00A1B8;stroke-width:2.8}
.c04-mapa.aberto .c04-ponto.aceso .c04-cel.hum{fill:#fff;stroke:#00010F;stroke-width:1.6}
.c04-poste,.c04-verga{fill:#8E90C8;stroke:#00010F;stroke-width:1.3}
.c04-porta-f{fill:#00010F;opacity:.6}
.c04-porta-g{fill:none;stroke:#E3E2FD;stroke-width:2}
.c04-band{transform-box:fill-box;transform-origin:50% 100%}
.c04-mastro{fill:#E3E2FD;stroke:#00010F;stroke-width:1}
.c04-pano{fill:#C9C9EE;stroke:#00010F;stroke-width:1.6;stroke-linejoin:round}
.c04-band.critica .c04-pano{fill:#fff}
.c04-estrela{fill:#000653}
.c04-trava rect{fill:#fff;stroke:#00010F;stroke-width:1.8}
.c04-dado rect{fill:#F6F6FF;stroke:#00010F;stroke-width:1.6}
.c04-dado circle{fill:#000653}
.c04-regiao{position:absolute;font-size:22px;line-height:26px;font-weight:800;letter-spacing:.01em;color:var(--lav-1);white-space:nowrap}
.c04-num{position:absolute;font-size:24px;line-height:28px;font-weight:820;font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap;transform-origin:0 60%}
.c04-nome{position:absolute;padding:1px 9px 2px;border-radius:7px;background:rgba(0,1,15,.88);box-shadow:inset 0 0 0 2px var(--l-300);font-size:21px;line-height:25px;font-weight:700;color:#fff;white-space:nowrap}

/* ---- a cópia de auditoria: o mesmo mapa, só contorno ---- */
.c04-f-linha{fill:none;stroke:#A9AADC;stroke-width:3.2;stroke-dasharray:13 10;opacity:.8}
.c04-f-band{stroke-dasharray:none;stroke-width:3;stroke-linejoin:round}
.c04-f-ponto rect{fill:rgba(169,170,220,.12);stroke:#A9AADC;stroke-width:3.2;stroke-dasharray:7 6}
.c04-f-ponto.conf rect{fill:rgba(0,161,184,.24);stroke:#00A1B8;stroke-dasharray:none}

/* ---- dentro da etapa: quatro casas e o portão ---- */
.c04-z-trilho{fill:#7477B6}
.c04-z-brilho{fill:#C1C1E3;opacity:.7}
.c04-casa{fill:#0A0F5C;stroke:#A9AADC;stroke-width:3}
.c04-casa.ia{stroke:#00A1B8}
.c04-casa.ia.acesa{fill:#00A1B8;stroke:#00010F}
.c04-casa.hum.acesa{fill:#F6F6FF;stroke:#00010F}
.c04-casa.c04-pulsa{animation:c04-pulsa 1.1s ease-in-out infinite alternate}
@keyframes c04-pulsa{from{stroke-width:3;stroke-opacity:1}to{stroke-width:7;stroke-opacity:.4}}
.c04-z-vao{fill:#00010F;opacity:.5}
.c04-z-grade rect{fill:#C9C9EE;stroke:#00010F;stroke-width:1.4}
.c04-z-poste{fill:#474C9A;stroke:#00010F;stroke-width:1.8}
.c04-z-verga{fill:#8E90C8;stroke:#00010F;stroke-width:1.8}
.c04-z-lampada{fill:#2A2F7C;stroke:#00010F;stroke-width:1.6}
.c04-z-lampada.acesa{fill:#fff}
.c04-letra{position:absolute;display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1;font-weight:880;color:var(--l-500)}
.c04-letra.acesa{color:var(--marinho)}
.c04-ciclo{position:absolute;margin:0;font-size:21px;line-height:26px;font-weight:600;color:var(--lav-1);text-shadow:0 2px 10px rgba(0,1,15,.6)}
.c04-ciclo b{display:block;font-size:24px;line-height:31px;font-weight:840;color:#fff}
.c04-ciclo i{font-style:normal;font-weight:840;color:#fff}
.c04-ciclo.ia i{color:var(--acento)}

/* ---- textos da cena, acima do mundo ---- */
.c04-placa{position:absolute;right:40px;top:108px;padding:8px 16px 9px;border-radius:8px;background:rgba(0,1,15,.72);box-shadow:inset 0 0 0 2px var(--l-300);font-size:22px;line-height:26px;font-weight:720;color:#fff;white-space:nowrap}
.c04-ponte{font-size:45px;line-height:54px;font-weight:840;letter-spacing:-.012em}
.c04-linha{position:absolute;left:0;top:602px;width:1280px;margin:0;text-align:center;white-space:nowrap;font-size:24px;line-height:30px;font-weight:650;color:var(--lav-1);text-shadow:0 2px 12px rgba(0,1,15,.75),0 0 2px rgba(0,1,15,.6)}
.c04-resp{position:absolute;left:830px;top:398px;width:410px;padding:20px 26px 22px;border-radius:5px;background:linear-gradient(176deg,#F6F6FF,#E3E2FD);color:var(--marinho);box-shadow:0 22px 46px rgba(0,1,15,.7),inset 0 0 0 1px rgba(0,6,83,.2);transform-origin:50% 0}
.c04-resp-n{font-size:40px;line-height:46px;font-weight:860;letter-spacing:-.02em;white-space:nowrap}
.c04-resp-r{margin-top:12px;padding-top:10px;border-top:1.5px solid rgba(0,6,83,.28);font-size:20px;line-height:25px;font-weight:580;color:var(--n-400)}
.c04-fecho-b{color:#fff}
.c04-fim{position:absolute;right:40px;top:106px;transform-origin:100% 50%}
.c04-fim .jg-go{position:static;display:inline-block;font-size:52px}
.c04-rolo{position:absolute;left:-13px;top:172px;width:26px;height:430px;border-radius:13px;background:linear-gradient(90deg,#7477B6,#F6F6FF 38%,#C9C9EE 68%,#565A94);box-shadow:0 0 0 2px #00010F,10px 0 20px rgba(0,1,15,.5)}

/* ---- movimento discreto nos passos que esperam a tecla (some com parado=1) ---- */
.c04-flutua{animation:c04-flutua 1.3s ease-in-out infinite alternate}
@keyframes c04-flutua{from{transform:translateY(-1px)}to{transform:translateY(-8px)}}
.c04-espera .jg-ap-o span{animation:c04-espera 1.8s ease-in-out infinite}
.c04-espera .jg-ap-o span:nth-child(2){animation-delay:.6s}
.c04-espera .jg-ap-o span:nth-child(3){animation-delay:1.2s}
@keyframes c04-espera{0%,45%,100%{box-shadow:inset 0 0 0 3px var(--l-200)}22%{box-shadow:inset 0 0 0 3px #fff,0 0 0 5px rgba(227,226,253,.3)}}

/* ============ CENA 05 · O final do jogo — As conquistas do analista ============
   Só o que é desta cena. Templo e cenário: jogo-templo.css. Cabeçalho, frase, cartão: jogo.css. Nada abaixo de 20 px.
   Azul e branco; nenhum ciano em HTML (o único ciano da cena está em SVG: a faísca e o marco do mundo 2). */

/* dia claro: luz própria da cena, por cima do templo ao amanhecer. O alto do céu fica escuro, para o título em branco */
.c05-ceu{position:absolute;inset:-60px;background:linear-gradient(180deg,#0B0F66 0%,#151A6E 14%,#2A2F7C 26%,#565A94 40%,#8E90D0 56%,#C9C8F4 72%,#ECEDFF 90%)}
.c05-raios{position:absolute;left:414px;top:-189px;width:800px;height:800px;border-radius:50%;background:repeating-conic-gradient(from 4deg,rgba(236,237,255,.2) 0 7deg,rgba(236,237,255,0) 7deg 20deg);
  -webkit-mask-image:radial-gradient(closest-side,transparent 14%,#000 22%,transparent 100%);mask-image:radial-gradient(closest-side,transparent 14%,#000 22%,transparent 100%);animation:c05-gira 120s linear infinite}
.c05-clarao{position:absolute;left:514px;top:-89px;width:600px;height:600px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(236,237,255,.22) 22%,rgba(236,237,255,.06) 50%,rgba(236,237,255,0) 100%)}
.c05-nevoa{position:absolute;inset:-80px;pointer-events:none;background:linear-gradient(180deg,rgba(236,237,255,0) 28%,rgba(236,237,255,.2) 58%,rgba(236,237,255,.34) 84%)}
@keyframes c05-gira{to{transform:rotate(360deg)}}

/* contador de conquistas: fica no lugar do HUD de vidas, com a mesma caixa */
.c05-placar{position:absolute;left:40px;right:40px;top:14px;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 14px;border-radius:12px;
  background:rgba(0,1,15,.66);box-shadow:inset 0 0 0 2px rgba(227,226,253,.4),0 6px 18px rgba(0,1,15,.4);color:#fff;white-space:nowrap}
.c05-slots{display:flex;align-items:center;gap:10px}
.c05-slot{position:relative;flex:none;width:38px;height:38px}
.c05-slot>svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.c05-slot .c05-md{opacity:0}
.c05-slot.cheia .c05-md{opacity:1}
.c05-slot.cheia .c05-oco{opacity:0}
.c05-slot .c05-oco circle{stroke:var(--l-300);stroke-width:8;stroke-dasharray:17.3 11.5}
.c05-cont{font-size:20px;line-height:1;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--l-200)}
.c05-cont b{display:inline-block;margin-right:11px;font-size:25px;line-height:1;font-weight:820;letter-spacing:0;color:#fff;font-variant-numeric:tabular-nums;transform-origin:100% 60%}

/* quadro de partida: a faixa "Fase concluída" com que a cena 04 termina */
.c05-partida{position:absolute;left:0;top:372px;width:1280px;text-align:center}
.c05-partida .jg-go{position:static;display:inline-block;font-size:74px}

/* aviso de conquista: sobe do pé da tela. Preso por baixo, cresce para cima: aguenta de 1 a 3 linhas de texto */
.c05-aviso{position:absolute;left:74px;bottom:26px;width:1100px;min-height:216px;display:flex;align-items:center;gap:30px;padding:22px 34px 24px 28px;border-radius:16px;
  background:#01021C;box-shadow:inset 0 0 0 2px rgba(227,226,253,.42),0 18px 40px rgba(0,1,15,.55);color:#fff}
.c05-av-m{position:relative;flex:none;width:150px;height:150px}
.c05-av-m>svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.c05-av-m>svg.c05-estouro{left:-36%;top:-36%;width:172%;height:172%;pointer-events:none}
.c05-medalha{position:absolute;left:0;top:0;width:100%;height:100%}
.c05-md{display:block;width:100%;height:100%;overflow:visible}
.c05-av-t{flex:1;min-width:0}
.c05-av-r{font-size:21px;line-height:26px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--l-200)}
.c05-av-n{display:flex;flex-wrap:wrap;align-items:center;gap:2px 20px;margin-top:1px}
.c05-av-nome{font-size:56px;line-height:1.1;font-weight:860;letter-spacing:-.02em;color:#fff;transform-origin:0 60%}
.c05-etq{margin-top:8px;padding:5px 15px 6px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--l-200);font-size:22px;line-height:26px;font-weight:740;letter-spacing:.02em;color:var(--lav-1);white-space:nowrap}
.c05-av-l{margin-top:7px;font-size:32px;line-height:40px;font-weight:600;color:var(--lav-1);text-wrap:balance}
/* a quinta conquista é maior que as outras */
.c05-aviso.grande{min-height:252px;gap:36px;padding-left:34px}
.c05-aviso.grande .c05-av-m{width:188px;height:188px}
.c05-aviso.grande .c05-av-nome{font-size:76px;line-height:1.06}
.c05-aura{position:absolute;left:-22%;top:-22%;width:144%;height:144%;border-radius:50%;background:repeating-conic-gradient(rgba(236,237,255,.24) 0 9deg,rgba(236,237,255,0) 9deg 22.5deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 60%,transparent 100%);mask-image:radial-gradient(closest-side,#000 60%,transparent 100%);animation:c05-gira 40s linear infinite}
/* cópia da medalha que sobe do aviso para o contador */
.c05-voo{position:absolute;pointer-events:none}

/* trilha dos quatro mundos (SVG, na camada dos atores) */
.c05-ponto,.c05-marco-i{transform-box:fill-box;transform-origin:50% 50%}
.c05-ponto{animation:c05-pulsa 2.6s ease-in-out infinite}
@keyframes c05-pulsa{0%,70%,100%{transform:scale(1)}35%{transform:scale(1.5)}}

/* painel do passo 6: as cinco de uma vez, só emblema e nome. Preso por baixo: nome de 3 linhas faz o painel crescer para cima, longe da pergunta */
.c05-painel{position:absolute;left:90px;bottom:114px;width:1100px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:8px;padding:26px 20px 30px;border-radius:16px;
  background:#01021C;box-shadow:inset 0 0 0 2px rgba(227,226,253,.42),0 18px 40px rgba(0,1,15,.55);color:#fff}
.c05-pn-item{display:flex;flex-direction:column;align-items:center;min-width:0}
.c05-pn-m{width:126px;height:126px}
.c05-pn-nome{margin-top:14px;min-height:64px;max-width:100%;text-align:center;font-size:28px;line-height:32px;font-weight:800;letter-spacing:-.008em;color:#fff;text-wrap:balance}

/* cartão dos créditos (Jogo.cartao): lista à esquerda, código QR à direita, endereço embaixo */
.c05-creditos .jg-ct-cab{font-size:24px;line-height:26px;padding-bottom:9px}
.c05-creditos .jg-ct-l{margin:3px 300px 0 0;font-size:27px;line-height:32px}
.c05-creditos .jg-ct-cab+.jg-ct-l{margin-top:12px;line-height:31px;font-weight:820}
.c05-creditos .jg-ct-l b{width:24px}
.c05-end{display:flex;align-items:center;gap:14px;height:52px;margin:13px 300px 0 0;padding:0 16px;border-radius:10px;border:3px dashed var(--l-500);white-space:nowrap}
.c05-qr{position:absolute;right:26px;top:72px;width:268px;height:268px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 20px;border-radius:12px;border:3px dashed var(--l-500);text-align:center}
.c05-vg-r{font-size:20px;line-height:24px;font-weight:840;letter-spacing:.14em;text-transform:uppercase;color:var(--n-400)}
.c05-vg-t{font-size:22px;line-height:27px;font-weight:600;color:var(--n-200);text-wrap:balance}
/* preenchidos (quando CREDITOS.endereco e CREDITOS.qr tiverem valor) */
.c05-end.cheia{border:0;height:auto;min-height:52px;padding:8px 18px;background:var(--marinho);white-space:normal}
.c05-end-url{min-width:0;overflow-wrap:anywhere;line-height:1.2;font-weight:800;letter-spacing:-.005em;color:#fff}
.c05-qr.cheia{border:0;padding:10px;background:#fff;box-shadow:inset 0 0 0 2px rgba(0,6,83,.2)}
.c05-qr.cheia img{display:block;width:100%;height:100%;image-rendering:pixelated}
/* créditos: coluna entre a lista e o código QR, rótulo pequeno em cima e o nome embaixo */
.c05-autoria{position:absolute;left:376px;top:80px;width:312px;display:flex;flex-direction:column;gap:9px;padding-left:18px;border-left:3px solid var(--l-500)}
.c05-autoria>div{display:flex;flex-direction:column}
.c05-au-r{font-size:20px;line-height:23px;font-weight:840;letter-spacing:.14em;text-transform:uppercase;color:var(--n-400)}
.c05-au-t{font-size:23px;line-height:28px;font-weight:760;color:var(--marinho);text-wrap:balance}
</style>
</head>

/* ================================================================
   SOM · Web Audio API, tudo sintetizado. Nenhum arquivo de áudio.
   Cadeia: [bus do passo] + [bus de ambiente] -> mestre -> compressor -> saída
   O contexto só nasce na primeira tecla (Som.destravar).
   ================================================================ */
const Som = (() => {
  let ac = null, mestre = null, comp = null, busPasso = null, busAmb = null;
  let ruidoBuf = null, mudo = false, travado = false;
  const GANHO_MESTRE = 0.5;
  const amb = {};                       // camadas contínuas: nome -> {ganho, parar}

  function criar() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 14; comp.ratio.value = 6;
    comp.attack.value = 0.004; comp.release.value = 0.22;
    mestre = ac.createGain(); mestre.gain.value = mudo ? 0 : GANHO_MESTRE;
    mestre.connect(comp); comp.connect(ac.destination);
    busAmb = ac.createGain(); busAmb.connect(mestre);
    busPasso = ac.createGain(); busPasso.connect(mestre);

    const d = ruidoBuf.getChannelData(0); let b0 = 0, b1 = 0, b2 = 0;

      d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.22;

  }

    const g = ac.createGain(); g.gain.value = ganho;

      const osc = ac.createOscillator(), g = ac.createGain(); osc.type = 'sine';

      const o2 = ac.createOscillator(), g2 = ac.createGain(); o2.type = 'triangle';
      o2.frequency.setValueAtTime(f * 1.5, t); env(g2, t, 0.003, g0 * 0.25, dur * 0.5);
      o2.connect(g2); g2.connect(busPasso); o2.start(t); o2.stop(t + dur);

    flauta(o = {}) {

      const g = ac.createGain(); g.connect(busPasso);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(g0, t + 0.06);

    novoJogador(o = {}) {
      const t = o.t || 0;
      [0, 2, 3, 5, 7].forEach((g, i) => P.chip({ t: t + i * 0.07, freq: penta(g, 523.25), dur: 0.065, ganho: 0.12 }));
      P.chip({ t: t + 0.36, freq: penta(10, 523.25), dur: 0.4, ganho: 0.12 }); P.chip({ t: t + 0.36, tipo: 'triangle', freq: penta(5, 523.25), dur: 0.5, ganho: 0.18 });

      notas.forEach(([g, q], i) => P.chip({ t: t + q, freq: penta(g, 523.25), dur: i === notas.length - 1 ? (o.completa ? 0.7 : 0.3) : 0.1, ganho: 0.13 }));
      if (o.completa) [0, 2, 3].forEach(g => P.chip({ t: t + 0.68, tipo: 'triangle', freq: penta(g, 261.63), dur: 0.8, ganho: 0.14 }));
    },
    /* falha de imagem: ruído curto e duas notas tortas */

    },

    presente(o = {}) { const t = o.t || 0; [5, 7, 10].forEach((g, i) => P.chip({ t: t + i * 0.09, tipo: 'triangle', freq: penta(g, 523.25), dur: 0.14, ganho: 0.2 })); }
  };

  /* ---------- ambiente: camadas contínuas, fora do bus do passo ---------- */
  function criarVento() {

    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.7;

  }

  /* corta tudo o que o passo agendou e abre um bus novo */
  function cortar() {

    velho.gain.cancelScheduledValues(t); velho.gain.setValueAtTime(velho.gain.value, t); velho.gain.linearRampToValueAtTime(0, t + 0.04);

  const api = { destravar, ambiente, cortar, alternarMudo, penta, travar() { travado = true; }, diag() { return ac ? { ac, saida: comp } : null; }, get mudo() { return mudo || travado; }, get vivo() { return !!ac; } };
  Object.keys(P).forEach(k => { api[k] = o => { if (pronto()) { try { P[k](o); } catch (e) {} } }; });
  return api;
})();

/* ================================================================
   MOTOR · registro de cenas, passos, teclas, link direto, impressão.

   Contrato de uma cena (objeto passado a Deck.registrar):
     id, titulo        identificação
     entrada           opcional. 'seca' = sem cortina ao entrar vindo da cena anterior (para a cena que
                       redesenha o último quadro da anterior e o desfaz no próprio passo 0)
     notas             { fala: '...', interacao: '...', rastreio: ['...', ...] }   (tecla N)
     montar(palco)     constrói o DOM dentro de `palco` no estado ANTES do passo 0
     desmontar()       solta referências (o motor esvazia o palco)
     passos[]          cada passo: { nome, ambiente?, tocar(ctx), fim() }
        tocar(ctx)     anima a partir do estado final do passo anterior e chama
                       ctx.concluir() ao terminar. Só agenda coisas pelo ctx
                       (ctx.em, ctx.anim, ctx.tween, ctx.temp), para tudo ser cancelável.
        fim()          aplica o estado final do passo, na hora, sem som. Idempotente.
        ambiente       som contínuo ao FIM do passo, ex.: { vento: 0.6 }. Herdado
                       pelos passos seguintes até alguém redefinir.
   Ir para o passo N = remontar a cena + fim() dos passos 0..N.
   ================================================================ */
const Deck = (() => {
  const W = 1280, H = 720;
  const cenas = [];
  const est = { c: 0, p: -1, animando: false, parado: false, montada: false, imprimindo: false };
  let quadro, palco, ind, notas, imp, exec = null, cortina = null;
  const CORTINA_MS = 700;

  function registrar(cena) { cenas.push(cena); return cena; }

  /* ---------- utilitários para as cenas ---------- */
  const util = {
    /* gerador pseudoaleatório com semente: o desenho sai igual em toda montagem */
    rng(semente) { let a = semente >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
    svg(nome, attrs) { const el = document.createElementNS('http://www.w3.org/2000/svg', nome); if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]); return el; },
    html(marcacao) { const t = document.createElement('template'); t.innerHTML = marcacao.trim(); return t.content.firstElementChild; },
    E: {
      lin: x => x, inQuad: x => x * x, outQuad: x => 1 - (1 - x) * (1 - x), inCubic: x => x * x * x, outCubic: x => 1 - Math.pow(1 - x, 3),
      inOut: x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2, outBack: x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2)
    }
  };

  /* ---------- execução de um passo: tudo nasce aqui e morre em encerrar() ---------- */
  function criarExec(aoConcluir) {
    const timers = new Set(), anims = new Set(), tweens = new Set(), temps = new Set();
    let viva = true;
    const ctx = {
      get viva() { return viva; },
      som: Som,
      /* temporizador cancelável */
      em(ms, fn) { const id = setTimeout(() => { timers.delete(id); if (viva) fn(); }, Math.max(0, ms)); timers.add(id); return id; },
      /* Web Animations; fill 'both' por padrão, cancelada no fim do passo (o estado final é o de fim()) */
      anim(el, quadros, op) {
        if (!el || !viva) return null;
        const o = typeof op === 'number' ? { duration: op } : Object.assign({}, op);
        if (o.fill == null) o.fill = 'both';
        const a = el.animate(quadros, o); anims.add(a); return a;
      },
      /* interpolação por quadro: fn(valorComCurva, progresso) */
      tween(dur, fn, op) {
        op = op || {}; const curva = op.curva || util.E.lin, tw = { id: 0 }, t0 = performance.now() + (op.atraso || 0);
        const tique = agora => {
          if (!viva) return;
          const p = (agora - t0) / dur;
          if (p >= 1) { fn(curva(1), 1); tweens.delete(tw); if (op.fim) op.fim(); return; }
          if (p >= 0) fn(curva(p), p);
          tw.id = requestAnimationFrame(tique);
        };
        tw.id = requestAnimationFrame(tique); tweens.add(tw); return tw;
      },
      /* elemento transitório (poeira, pedra que cai): removido no fim do passo */
      temp(el) { temps.add(el); return el; },
      soltar(el) { temps.delete(el); if (el) el.remove(); },
      /* tremor curto de um elemento (o "mundo" da cena, não o texto) */
      tremor(el, px, ms) {
        px = px || 6; const n = 7, q = [{ transform: 'translate(0px,0px)' }];
        for (let i = 1; i < n; i++) { const k = 1 - i / n, s = i % 2 ? 1 : -1; q.push({ transform: `translate(${(s * px * k * (0.55 + 0.45 * Math.random())).toFixed(1)}px,${(-s * px * k * 0.8).toFixed(1)}px)` }); }
        q.push({ transform: 'translate(0px,0px)' });
        return ctx.anim(el, q, { duration: ms || 240, easing: 'linear', fill: 'none' });
      },
      concluir() { if (viva) aoConcluir(); },
      encerrar() {
        viva = false;
        timers.forEach(clearTimeout); timers.clear();
        tweens.forEach(t => cancelAnimationFrame(t.id)); tweens.clear();
        anims.forEach(a => { try { a.cancel(); } catch (e) {} }); anims.clear();
        temps.forEach(el => el.remove()); temps.clear();

  }
  function pararExec() { if (exec) { exec.encerrar(); exec = null; } est.animando = false; }

  /* ---------- montagem e navegação ---------- */
  /* cortina: ao avançar de uma cena para a seguinte, o último quadro da cena que sai fica por cima da que entra
     e se desfaz em CORTINA_MS. O palco velho vira a cortina sem ser movido no DOM (as animações de fundo não recomeçam). */
  function soltarCortina() { if (cortina) { cortina.remove(); cortina = null; } }
  function montar(i, comCortina) {
    soltarCortina();
    if (est.montada) { try { cenas[est.c].desmontar(); } catch (e) {} }
    if (comCortina && cenas[i].entrada !== 'seca' && est.montada && !est.parado && palco.firstChild) {
      const c = cortina = palco; c.removeAttribute('id'); c.classList.add('cortina');
      palco = document.createElement('div'); palco.id = 'palco'; palco.className = 'palco';
      quadro.insertBefore(palco, c);
      c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: CORTINA_MS, easing: 'ease-in-out', fill: 'forwards' }).onfinish = () => { c.remove(); if (cortina === c) cortina = null; };
    } else palco.replaceChildren();

    cenas[i].montar(palco);
  }
  /* ?cena=02 acha pelo id; ?cena=2 acha a cena de id numérico 2; sem id que sirva, vale a posição no build */
  function acharCena(v) {
    if (v == null || v === '') return 0;
    let i = cenas.findIndex(c => String(c.id) === v);
    if (i < 0 && /^\d+$/.test(v)) i = cenas.findIndex(c => /^\d+$/.test(String(c.id)) && parseInt(c.id, 10) === parseInt(v, 10));
    if (i < 0 && /^\d+$/.test(v)) i = parseInt(v, 10) - 1;
    return Math.max(0, Math.min(cenas.length - 1, i));
  }
  /* número mostrado no indicador: o do id ('02' -> 2), para não mudar conforme o build */
  const numDaCena = i => /^\d+$/.test(String(cenas[i].id)) ? parseInt(cenas[i].id, 10) : i + 1;
  function ambienteDe(c, p) {
    for (let k = p; k >= 0; k--) { const a = cenas[c].passos[k].ambiente; if (a) return a; }
    return {};
  }
  /* estado final do passo p da cena c, sem animação e sem som de passo */
  function irPara(c, p) {
    c = Math.max(0, Math.min(cenas.length - 1, c));
    p = Math.max(0, Math.min(cenas[c].passos.length - 1, p));
    pararExec(); Som.cortar();
    montar(c);
    for (let k = 0; k <= p; k++) cenas[c].passos[k].fim();
    est.p = p;
    Som.ambiente(ambienteDe(c, p), 0.6);
    atualizarUI();
  }
  /* toca o passo p; pressupõe o estado final do passo p-1 */
  function tocar(p) {
    const passo = cenas[est.c].passos[p];
    pararExec(); Som.cortar();
    est.p = p; est.animando = true;
    const minha = exec = criarExec(() => {
      if (exec !== minha) return;
      passo.fim();                      // fixa o estado final em estilo inline...
      minha.encerrar(); exec = null;    // ...e só então solta as animações
      est.animando = false;
      Som.ambiente(ambienteDe(est.c, p), 1.5);
      atualizarUI();
    });
    atualizarUI();
    try { passo.tocar(minha); } catch (erro) { console.error(erro); irPara(est.c, p); }
  }
  function entrarCena(i, comCortina) {
    pararExec(); Som.cortar(); montar(i, comCortina);
    if (est.parado) irPara(i, 0); else tocar(0);
  }
  function avancar() {
    if (est.animando) { irPara(est.c, est.p); return; }          // pula para o fim do passo atual
    const n = cenas[est.c].passos.length;
    if (est.p < n - 1) { if (est.parado) irPara(est.c, est.p + 1); else tocar(est.p + 1); }
    else if (est.c < cenas.length - 1) entrarCena(est.c + 1, true);
    else piscar();
  }
  function voltar() {
    if (est.p > 0) irPara(est.c, est.p - 1);
    else if (est.c > 0) irPara(est.c - 1, cenas[est.c - 1].passos.length - 1);
    else irPara(0, 0);
  }
  function piscar() { ind.animate([{ opacity: 1 }, { opacity: .55 }], { duration: 500 }); }

  /* ---------- interface do apresentador ---------- */
  function atualizarUI() {
    const c = cenas[est.c];
    ind.innerHTML = `${numDaCena(est.c)} · ${Math.max(est.p, 0)}/${c.passos.length - 1}` + (Som.mudo ? '<span class="mudo">mudo</span>' : '');
    if (notas.classList.contains('aberto')) preencherNotas();
  }
  const esc = s => String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
  function preencherNotas() {
    const c = cenas[est.c], n = c.notas || {}, passo = c.passos[Math.max(est.p, 0)];
    notas.innerHTML = `<h2>Cena ${numDaCena(est.c)} · passo ${Math.max(est.p, 0)} de ${c.passos.length - 1}</h2>` +
      `<p class="tit">${esc(c.titulo || c.id)}</p>` + (passo && passo.nome ? `<p>Agora: ${esc(passo.nome)}</p>` : '') +
      (n.fala ? `<h3>Fala</h3><p>${esc(n.fala)}</p>` : '') +
      (n.interacao ? `<h3>Interação com a turma</h3><p>${esc(n.interacao)}</p>` : '') +
      (n.rastreio && n.rastreio.length ? `<h3>Rastreio</h3><ul>${n.rastreio.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '') +
      `<p class="teclas">→ ou Espaço: avança (ou pula a animação) · ←: volta · R: reinicia a cena · M: som · F: tela cheia · N: notas</p>`;
  }
  function alternarNotas() { if (notas.classList.toggle('aberto')) preencherNotas(); }
  function telaCheia() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  }
  let escalaAnt = 0;
  function ajustar() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    if (escalaAnt && Math.abs(s - escalaAnt) > 0.001) { quadro.style.display = 'none'; void quadro.offsetHeight; quadro.style.display = ''; }
    escalaAnt = s;
    quadro.style.transform = `translate(${Math.max(0, (innerWidth - W * s) / 2).toFixed(2)}px,${Math.max(0, (innerHeight - H * s) / 2).toFixed(2)}px) scale(${s.toFixed(5)})`;
  }
  function tecla(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const mapa = {
      'ArrowRight': avancar, ' ': avancar, 'Spacebar': avancar, 'PageDown': avancar, 'Enter': avancar,
      'ArrowLeft': voltar, 'PageUp': voltar,
      'r': () => entrarCena(est.c),
      'm': () => { Som.alternarMudo(); atualizarUI(); },
      'f': telaCheia, 'n': alternarNotas,
      'Home': () => entrarCena(0),
      'End': () => irPara(cenas.length - 1, 1e9)
    };
    if (/^[1-9]$/.test(k)) {                // ensaio: o número vai direto para a cena de mesmo id
      const i = cenas.findIndex(c => /^\d+$/.test(String(c.id)) && parseInt(c.id, 10) === +k);
      if (i >= 0 && !e.repeat) { e.preventDefault(); Som.destravar(); entrarCena(i); }
      return;
    }
    if (!mapa[k]) return;
    e.preventDefault();
    if (e.repeat) return;                 // tecla presa não atropela os passos
